<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>8B1 Breathing and Respiration Revision</title>
<meta name="description" content="Interactive Year 8 Science revision for 8B1 Breathing and Respiration. Works offline.">
<style>
:root{
  --bg:#1b0e35;--bg2:#2a1553;--bg3:#3a1f6e;
  --card:#ffffff;--card2:#f5f1fd;--ink:#1c1235;--muted:#5a5074;--line:#ded6f0;
  --purple:#4b2575;--violet:#6d3fb5;--lav:#e9defa;
  --teal:#0a7d71;--teal2:#d9f3ef;--blue:#1f5fc4;--blue2:#dbe8fb;
  --coral:#c93a54;--coral2:#fde3e8;--orange:#e8832a;--orange2:#ffe9d2;--gold:#f6c343;
  --ok:#0a7d71;--bad:#c93a54;--onbg:#f3ecff;--onbg2:#cdbff0;
  --r:16px;--sh:0 6px 20px rgba(10,0,40,.28);
  --fs:17px;
}
*{box-sizing:border-box}
html{font-size:var(--fs);scroll-behavior:smooth}
html.big{--fs:20px}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#3b1f73 0%,transparent 60%),var(--bg);color:var(--onbg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;min-height:100vh}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;line-height:1.2;margin:0 0 .5rem}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:.4rem 0 .8rem}
a{color:#bfa6ff}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--gold);color:#000;padding:.5rem 1rem;z-index:99;border-radius:8px}
.skip:focus{left:8px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(27,14,53,.92);backdrop-filter:blur(8px);border-bottom:1px solid #46288a}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-family:Georgia,serif;font-weight:700;font-size:1.05rem}
.brand svg{width:34px;height:34px;flex:none}
.brand small{display:block;font-family:system-ui,sans-serif;font-weight:500;font-size:.72rem;color:var(--onbg2);letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav a,.nav button{background:transparent;color:var(--onbg);border:1px solid transparent;padding:.45rem .8rem;border-radius:999px;text-decoration:none;font-size:.9rem;font-weight:600}
.nav a:hover,.nav button:hover{background:#3a2370}
.nav a[aria-current=page]{background:var(--gold);color:#2a1a00}
main{padding:22px 0 60px;min-height:70vh}
footer{border-top:1px solid #46288a;padding:20px 0;color:var(--onbg2);font-size:.85rem}
footer a{color:var(--onbg)}
/* cards & layout */
.card{background:var(--card);color:var(--ink);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card h2,.card h3{color:var(--purple)}
.card.alt{background:var(--card2)}
.card.dark{background:var(--bg2);color:var(--onbg);border:1px solid #4a2c8d}
.card.dark h2,.card.dark h3{color:#fff}
.stack>*+*{margin-top:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)}.onbg-muted{color:var(--onbg2)}
.small{font-size:.85rem}
.center{text-align:center}
.hide{display:none!important}
/* buttons */
.btn{border:0;border-radius:12px;padding:.65rem 1.1rem;font-weight:700;background:var(--lav);color:var(--purple);min-height:44px;transition:transform .12s,background .15s,box-shadow .15s;text-decoration:none;display:inline-flex;align-items:center;gap:.45rem;justify-content:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(40,10,90,.2)}
.btn:active{transform:none}
.btn.primary{background:var(--orange);color:#2a1300}
.btn.teal{background:var(--teal);color:#fff}
.btn.coral{background:var(--coral);color:#fff}
.btn.purple{background:var(--purple);color:#fff}
.btn.ghost{background:transparent;border:2px solid currentColor}
.btn.sm{padding:.4rem .8rem;min-height:36px;font-size:.9rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.on{background:var(--teal);color:#fff}
/* hero */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:stretch}
.hero .main{background:linear-gradient(135deg,#4b2575 0%,#2f1a63 60%,#1f3f8f 130%);border-radius:24px;padding:28px;box-shadow:var(--sh);border:1px solid #5c37a6;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:2.1rem}
.hero .tag{display:inline-block;background:var(--gold);color:#2a1a00;font-weight:800;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;padding:.2rem .6rem;border-radius:999px;margin-bottom:.6rem}
.hero .lungs-bg{position:absolute;right:-30px;bottom:-30px;width:260px;opacity:.18}
.ringwrap{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),#e3dbf3 0);display:grid;place-items:center;flex:none}
.ring>div{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--purple);font-size:1.3rem}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
/* module cards */
.mod{display:flex;flex-direction:column;gap:10px;position:relative;transition:transform .15s,box-shadow .15s}
.mod:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(10,0,40,.38)}
.mod .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--lav);flex:none}
.mod .ico svg{width:30px;height:30px}
.mod h3{margin:0;font-size:1.05rem}
.mod .num{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.steps4{display:flex;gap:6px}
.steps4 span{flex:1;height:8px;border-radius:99px;background:#e3dbf3;overflow:hidden;position:relative}
.steps4 span i{position:absolute;inset:0;width:0;background:var(--teal);border-radius:99px;transition:width .5s}
.bar{height:10px;border-radius:99px;background:#e3dbf3;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2bb3a3);border-radius:99px;transition:width .6s}
.bar.thin{height:7px}
.badge-chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:700;padding:.2rem .6rem;border-radius:99px;background:var(--lav);color:var(--purple)}
.badge-chip.good{background:var(--teal2);color:#075a51}
.badge-chip.warn{background:var(--orange2);color:#7a3d00}
.badge-chip.bad{background:var(--coral2);color:#8a1d33}
/* tabs / stepper */
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.stepper a{flex:1;min-width:130px;text-decoration:none;background:var(--bg2);border:2px solid #4a2c8d;color:var(--onbg);padding:.6rem .9rem;border-radius:14px;font-weight:700;display:flex;gap:.6rem;align-items:center}
.stepper a .n{width:28px;height:28px;border-radius:50%;background:#4a2c8d;display:grid;place-items:center;font-size:.85rem;flex:none}
.stepper a[aria-current=step]{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
.stepper a[aria-current=step] .n{background:#2a1a00;color:var(--gold)}
.stepper a.done .n{background:var(--teal);color:#fff}
.stepper a small{display:block;font-weight:500;opacity:.85;font-size:.72rem}
.crumbs{font-size:.88rem;color:var(--onbg2);margin-bottom:8px}
.crumbs a{color:var(--onbg)}
/* learn */
.kw{background:none;border:0;border-bottom:2px dotted var(--violet);color:inherit;font:inherit;font-weight:700;padding:0;cursor:help;color:var(--purple)}
.card.dark .kw{color:#ffe08a;border-color:#ffe08a}
.kw:hover{background:var(--lav)}
.callout{border-left:6px solid var(--orange);background:var(--orange2);color:#3b1d00;padding:12px 16px;border-radius:10px;margin:12px 0}
.callout.teal{border-color:var(--teal);background:var(--teal2);color:#06443d}
.callout.blue{border-color:var(--blue);background:var(--blue2);color:#0c2f66}
.callout.coral{border-color:var(--coral);background:var(--coral2);color:#6a1224}
.callout b.t{display:block;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.chain{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch;margin:10px 0}
.chain div{background:var(--purple);color:#fff;padding:.5rem .8rem;border-radius:10px;font-weight:700;font-size:.9rem;display:flex;align-items:center}
.chain div.end{background:var(--blue)}
.chain div.arrow{background:none;color:var(--orange);padding:0 .1rem;font-size:1.3rem}
table.t{border-collapse:collapse;width:100%;font-size:.95rem}
table.t th,table.t td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
table.t th{background:var(--purple);color:#fff}
table.t td:first-child{font-weight:700;background:var(--card2)}
.tablewrap{overflow-x:auto}
ul.tick{list-style:none;padding:0;margin:.4rem 0}
ul.tick li{padding-left:1.7rem;position:relative;margin:.3rem 0}
ul.tick li:before{content:"✓";position:absolute;left:0;color:var(--teal);font-weight:900}
.diagram{background:#fbf9ff;border:1px solid var(--line);border-radius:14px;padding:8px}
.diagram svg{width:100%;height:auto;display:block}
/* sims */
.sim{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.sim{grid-template-columns:1fr}}
.ctrls{display:flex;flex-direction:column;gap:12px}
.ctrls label{font-weight:700;font-size:.92rem;display:block;margin-bottom:2px}
input[type=range]{width:100%;accent-color:var(--teal);height:32px}
.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.readout div{background:var(--card2);border-radius:12px;padding:8px 10px;border:1px solid var(--line)}
.readout b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.readout span{font-weight:800;color:var(--purple)}
.gauge{height:12px;border-radius:99px;background:#e3dbf3;position:relative;margin-top:5px;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:99px;transition:width .08s linear}
.gauge i.o{background:var(--orange)}
.gauge i.c{background:var(--coral)}
.gauge .mark{position:absolute;top:-2px;bottom:-2px;width:3px;background:#1c1235}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs2 button{border:2px solid var(--line);background:#fff;color:var(--purple);border-radius:999px;padding:.4rem .9rem;font-weight:700}
.tabs2 button[aria-selected=true]{background:var(--purple);color:#fff;border-color:var(--purple)}
.act{margin-top:18px}
.act>header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.act>header h3{margin:0}
.done-flag{margin-left:auto}
/* questions */
.q{background:#fff;color:var(--ink);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:16px;border-top:6px solid var(--violet)}
.q.ao2{border-top-color:var(--blue)}.q.ao3{border-top-color:var(--coral)}.q.ao1{border-top-color:var(--teal)}
.q .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.q .qt{font-weight:600;font-size:1.02rem;margin:.2rem 0 .8rem}
.q .qt p{margin:.2rem 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);padding:.65rem .9rem;border-radius:12px;font-weight:500;min-height:46px;align-items:flex-start;transition:border .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--violet);background:var(--card2)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--purple)}
.opt.sel{border-color:var(--violet);background:var(--lav)}
.opt.right{border-color:var(--ok);background:var(--teal2)}
.opt.wrong{border-color:var(--bad);background:var(--coral2)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-weight:500;animation:pop .25s}
.fb.ok{background:var(--teal2);color:#06443d;border:1px solid #8dd5cb}
.fb.bad{background:var(--coral2);color:#6a1224;border:1px solid #f0a7b5}
.fb.part{background:var(--orange2);color:#5b2d00;border:1px solid #f1c28f}
.fb b.h{display:block;margin-bottom:2px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.hint{margin-top:8px}
.hint summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:.9rem}
.hint div{background:var(--blue2);color:#0c2f66;border-radius:10px;padding:8px 12px;margin-top:6px;font-size:.92rem}
select.gapsel{font:inherit;padding:.25rem .4rem;border:2px solid var(--violet);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
select.gapsel.right{border-color:var(--ok);background:var(--teal2)}
select.gapsel.wrong{border-color:var(--bad);background:var(--coral2)}
input.num{font:inherit;width:8rem;padding:.45rem .6rem;border:2px solid var(--violet);border-radius:10px}
textarea.ans{width:100%;min-height:110px;font:inherit;padding:.7rem;border:2px solid var(--violet);border-radius:12px;color:var(--ink);resize:vertical}
.wb{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.wb label{display:flex;gap:10px;align-items:flex-start;padding:.35rem 0;cursor:pointer}
.wb input{width:22px;height:22px;flex:none;accent-color:var(--teal);margin-top:2px}
.kwrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.kwrow span{font-size:.8rem;font-weight:700;padding:.15rem .55rem;border-radius:99px}
.kwrow .y{background:var(--teal2);color:#075a51}.kwrow .n{background:var(--orange2);color:#7a3d00}
.starters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.starters button{background:var(--blue2);border:1px dashed var(--blue);color:#0c2f66;border-radius:99px;padding:.25rem .7rem;font-size:.85rem}
/* dnd */
.bank{display:flex;gap:8px;flex-wrap:wrap;min-height:48px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--card2);margin:8px 0}
.chipd{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--violet);background:#fff;color:var(--purple);border-radius:10px;padding:.35rem .75rem;font-weight:700;cursor:grab;min-height:38px;font-size:.95rem}
.chipd.sel{background:var(--gold);border-color:#a37400;color:#2a1a00;box-shadow:0 0 0 3px rgba(246,195,67,.5)}
.chipd.right{border-color:var(--ok);background:var(--teal2);color:#06443d}
.chipd.wrong{border-color:var(--bad);background:var(--coral2);color:#6a1224}
.chipd.ghost{position:fixed;z-index:60;pointer-events:none;opacity:.9;transform:rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.slot{min-width:120px;min-height:46px;border:2px dashed var(--violet);border-radius:12px;background:#fff;display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:4px;color:var(--muted);font-size:.85rem;vertical-align:middle;cursor:pointer}
.slot.over{background:var(--lav);border-style:solid}
.slot.target-ready{border-color:var(--orange);background:var(--orange2)}
.slot.right{border-color:var(--ok);border-style:solid}
.slot.wrong{border-color:var(--bad);border-style:solid}
.eq{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:800;font-size:1.1rem;margin:10px 0}
.eq .op{color:var(--orange);font-size:1.4rem}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bin{border:2px dashed var(--violet);border-radius:14px;padding:8px;min-height:90px;background:#fff;cursor:pointer}
.bin h4{margin:0 0 6px;color:var(--purple);font-family:system-ui;font-size:.95rem}
.bin .holder{display:flex;gap:6px;flex-wrap:wrap}
.bin.over{background:var(--lav)}
.bin.target-ready{border-color:var(--orange);background:var(--orange2)}
.labelzone{position:relative}
.labelzone .hs{position:absolute;transform:translate(-50%,-50%);min-width:92px;min-height:34px;padding:2px;border:2px dashed var(--violet);border-radius:9px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer}
.labelzone .hs .chipd{font-size:.78rem;padding:.15rem .5rem;min-height:28px}
.labelzone .hs.over{background:var(--lav)}
.labelzone .hs.target-ready{border-color:var(--orange);background:var(--orange2)}
.labelzone .hs.right{border-color:var(--ok);border-style:solid}
.labelzone .hs.wrong{border-color:var(--bad);border-style:solid}
.labelzone .hs .num{color:var(--muted);font-weight:800}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.mgrid button{border:2px solid var(--line);background:#fff;color:var(--ink);padding:.5rem .7rem;border-radius:10px;text-align:left;min-height:44px;font-weight:600;position:relative}
.mgrid button.sel{border-color:var(--orange);background:var(--orange2)}
.mgrid button[data-p]{border-width:3px}
.mgrid button .pn{position:absolute;right:8px;top:6px;width:22px;height:22px;border-radius:50%;background:var(--violet);color:#fff;font-size:.75rem;display:grid;place-items:center}
.mgrid button.right{border-color:var(--ok);background:var(--teal2)}
.mgrid button.wrong{border-color:var(--bad);background:var(--coral2)}
@media(max-width:560px){.mgrid{grid-template-columns:1fr}}
/* order */
.ordlist{display:grid;gap:8px;margin:8px 0;counter-reset:o}
.ordlist button{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:.55rem .8rem;border-radius:10px;text-align:left;font-weight:600;min-height:44px}
.ordlist button.used{opacity:.4}
.yours{display:grid;gap:6px;margin:8px 0}
.yours li{background:var(--lav);border-radius:10px;padding:.45rem .8rem;font-weight:700;color:var(--purple)}
.yours li.right{background:var(--teal2);color:#06443d}.yours li.wrong{background:var(--coral2);color:#6a1224}
/* flash */
.flash{perspective:900px;max-width:520px;margin:0 auto}
.flash .fc{position:relative;height:230px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flash .fc.flip{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;box-shadow:var(--sh)}
.flash .front{background:linear-gradient(135deg,var(--purple),#3a2a8f);color:#fff}
.flash .front b{font-family:Georgia,serif;font-size:1.8rem}
.flash .back{background:#fff;color:var(--ink);transform:rotateY(180deg);border:3px solid var(--teal)}
.rm .flash .fc{transition:none}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(10,0,30,.65);z-index:70;display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;color:var(--ink);border-radius:18px;max-width:520px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
.modal h3{color:var(--purple)}
.toasts{position:fixed;right:14px;bottom:14px;z-index:80;display:grid;gap:8px;max-width:calc(100vw - 28px)}
.toast{background:var(--gold);color:#2a1a00;padding:.7rem 1rem;border-radius:14px;font-weight:700;box-shadow:var(--sh);animation:pop .3s;display:flex;gap:10px;align-items:center}
/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bdg{text-align:center;padding:14px 10px;border-radius:16px;background:var(--card2);border:2px solid var(--line);color:var(--ink)}
.bdg svg{width:54px;height:54px}
.bdg b{display:block;font-size:.88rem;color:var(--purple)}
.bdg span{font-size:.75rem;color:var(--muted)}
.bdg.locked{filter:grayscale(1);opacity:.55}
/* charts */
.chart{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:system-ui,sans-serif}
.tablewrap table.data{border-collapse:collapse}
.tablewrap table.data th,.tablewrap table.data td{border:1px solid var(--line);padding:.35rem .8rem;text-align:center}
.tablewrap table.data th{background:var(--card2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-top:4px}

<script>
/* ===== utilities ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(a,n){return shuffle(a).slice(0,n)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pct=(a,b)=>b?Math.round(100*a/b):0;
const fmtDate=ts=>{try{return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}catch(e){return ''}};
const LET='ABCDEFGH';

/* ===== state (localStorage with in-memory fallback) ===== */
const KEY='y8b1_breathing_revision_v1';
let S,memStore=null,storeOK=true;
function defaults(){return{v:1,set:{rm:false,big:false},steps:{},q:{},checks:{},exams:[],vocab:{},badges:{},last:null,written:{}}}
function loadState(){
  let raw=null;
  try{raw=localStorage.getItem(KEY)}catch(e){storeOK=false;raw=memStore}
  try{const o=raw&&JSON.parse(raw);S=(o&&o.v===1)?Object.assign(defaults(),o):defaults()}catch(e){S=defaults()}
}
function save(){
  const s=JSON.stringify(S);
  try{localStorage.setItem(KEY,s)}catch(e){storeOK=false;memStore=s}
}
function resetAll(){S=defaults();save();applySettings()}
function stp(m){return S.steps['m'+m]||(S.steps['m'+m]={learn:0,explore:{},check:0})}
function markLearn(m){const s=stp(m);if(!s.learn){s.learn=1;save();checkBadges()}}
function markExplore(m,id){const s=stp(m);if(!s.explore[id]){s.explore[id]=1;save();refreshFlags();checkBadges()}}
function refreshFlags(){$$('[data-flag]').forEach(f=>{const [m,id]=f.dataset.flag.split(':');if(stp(m).explore[id]){f.classList.remove('hide')}})}
function applySettings(){document.documentElement.classList.toggle('rm',!!S.set.rm);document.documentElement.classList.toggle('big',!!S.set.big)}
function reduced(){return !!S.set.rm||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)}

/* ===== question stats ===== */
function recordQ(q,earned,of){
  const r=S.q[q.id]||(S.q[q.id]={n:0,e:0,o:of,best:0,ok:0});
  const prevBestPct=r.n?r.best/r.o:-1;
  r.n++;r.e=earned;r.o=of;r.ok=earned===of?1:0;r.best=Math.max(r.best,earned);r.t=Date.now();
  if(r.n>1&&earned/of>prevBestPct+0.001){S.improved=(S.improved||0)+1}
  save();checkBadges();
}
function modAcc(m){let e=0,o=0,n=0;for(const q of QS){if(q.m!==m)continue;const r=S.q[q.id];if(r){e+=r.e;o+=r.o;n++}}return{e,o,n,acc:o?e/o:null}}
function aoAcc(ao){let e=0,o=0,n=0;for(const q of QS){if(q.ao!==ao)continue;const r=S.q[q.id];if(r){e+=r.e;o+=r.o;n++}}return{e,o,n,acc:o?e/o:null}}
function practiseSet(m){return QS.filter(q=>q.m===m&&!q.chk)}
function checkPool(m){return QS.filter(q=>q.m===m&&q.chk)}
function modProg(m){
  const s=stp(m),mod=MODS[m-1];
  const learn=s.learn?1:0;
  const ex=mod.explore.length?mod.explore.filter(a=>s.explore[a.id]).length/mod.explore.length:1;
  const ps=practiseSet(m);const pr=ps.length?ps.filter(q=>S.q[q.id]).length/ps.length:1;
  const ch=(S.checks['m'+m]||[]).length?1:0;
  return{learn,explore:ex,practise:pr,check:ch,total:Math.round(100*(learn+ex+pr+ch)/4)};
}
function overall(){let t=0;for(const m of MODS)t+=modProg(m.n).total;return Math.round(t/MODS.length)}
function bestCheck(m){const a=S.checks['m'+m]||[];return a.length?Math.max(...a.map(x=>pct(x.s,x.t))):null}

/* ===== glossary text ===== */
function rt(s){
  return String(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,d)=>`<button class="kw" data-term="${esc(t.toLowerCase())}" type="button">${esc(d||t)}</button>`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\{sub:([^}]+)\}/g,'<sub>$1</sub>');
}
function showTerm(t){
  t=ALIAS[t]||t;const g=GLOSS[t];if(!g)return;
  const v=S.vocab[t];
  const box=openModal(`<h3>${esc(g.t||t)}</h3>${g.p?`<p class="muted small">Say it: <b>${esc(g.p)}</b></p>`:''}<p style="font-size:1.05rem">${rt(g.d)}</p>${g.eg?`<p class="callout blue"><b class="t">Example</b>${rt(g.eg)}</p>`:''}<div class="row"><button class="btn teal sm" data-v="known">I know this</button><button class="btn sm" data-v="learning">Still learning</button><span class="sp"></span><button class="btn sm purple" data-close>Close</button></div>`);
  box.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b){S.vocab[t]=b.dataset.v;save();checkBadges();closeModal();toast('Saved: '+(b.dataset.v==='known'?'you know “'+(g.t||t)+'”':'we’ll keep “'+(g.t||t)+'” in your learning list'))}});
}
let lastFocus=null;
function openModal(html){
  closeModal();lastFocus=document.activeElement;
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-close]'))closeModal()});
  m.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  const b=$('.box',m);b.focus();return b;
}
function closeModal(){const m=$('.modal');if(m){m.remove();if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}}
function toast(msg){
  let t=$('.toasts');if(!t){t=document.createElement('div');t.className='toasts';t.setAttribute('role','status');document.body.appendChild(t)}
  const d=document.createElement('div');d.className='toast';d.innerHTML=msg;t.appendChild(d);setTimeout(()=>d.remove(),4200);
}
document.addEventListener('click',e=>{const k=e.target.closest('.kw');if(k)showTerm(k.dataset.term)});

/* ===== charts ===== */
function chart(sp){
  const W=sp.w||560,H=sp.h||340,L=58,R=18,T=18,B=52;
  const [x0,x1,xs]=sp.x,[y0,y1,ys]=sp.y;
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>H-B-(v-y0)/(y1-y0)*(H-T-B);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.alt||sp.title||'Graph')}"><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="#fbf9ff"/>`;
  for(let v=y0;v<=y1+1e-9;v+=ys){const y=Y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e3dbf3"/><text x="${L-8}" y="${y+4}" font-size="12" text-anchor="end" fill="#3b3158">${+v.toFixed(2)}</text>`}
  if(sp.type==='bar'){
    const n=sp.cats.length,bw=(W-L-R)/n;
    sp.cats.forEach((c,i)=>{s+=`<text x="${L+bw*(i+.5)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="#3b3158">${esc(c)}</text>`});
    sp.series.forEach((se,si)=>{const k=sp.series.length,w=bw*.7/k;se.pts.forEach((p,i)=>{const x=L+bw*i+bw*.15+w*si;s+=`<rect x="${x}" y="${Y(p)}" width="${w}" height="${Y(y0)-Y(p)}" fill="${se.c||'#6d3fb5'}" rx="3"/>`})});
  }else{
    for(let v=x0;v<=x1+1e-9;v+=xs){const x=X(v);s+=`<line y1="${T}" y2="${H-B}" x1="${x}" x2="${x}" stroke="#eee7fa"/><text x="${x}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="#3b3158">${+v.toFixed(2)}</text>`}
    (sp.series||[]).forEach(se=>{
      if(se.line!==false&&se.pts.length>1)s+=`<polyline fill="none" stroke="${se.c||'#6d3fb5'}" stroke-width="3" stroke-linejoin="round" points="${se.pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
      if(se.dots!==false)se.pts.forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${se.r||4.5}" fill="${se.c||'#6d3fb5'}" ${se.stroke?'stroke="#fff" stroke-width="1.5"':''}/>`});
    });
    if(sp.fit)s+=`<line x1="${X(sp.fit.x[0])}" y1="${Y(sp.fit.y[0])}" x2="${X(sp.fit.x[1])}" y2="${Y(sp.fit.y[1])}" stroke="#c93a54" stroke-width="2.5" stroke-dasharray="7 5"/>`;
  }
  (sp.hl||[]).forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="9" fill="none" stroke="#e8832a" stroke-width="3"/>${p[2]?`<text x="${X(p[0])+12}" y="${Y(p[1])-8}" font-size="12" font-weight="700" fill="#8a4a00">${esc(p[2])}</text>`:''}`});
  if(sp.cross){const cx_=X(sp.cross[0]),cy_=Y(sp.cross[1]);s+=`<line x1="${cx_}" x2="${cx_}" y1="${T}" y2="${H-B}" stroke="#e8832a" stroke-width="2" stroke-dasharray="5 4"/><line x1="${L}" x2="${W-R}" y1="${cy_}" y2="${cy_}" stroke="#e8832a" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${cx_}" cy="${cy_}" r="7" fill="#e8832a" stroke="#fff" stroke-width="2"/>`}
  s+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="#1c1235" stroke-width="2"/><line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="#1c1235" stroke-width="2"/>`;
  s+=`<text x="${(L+W-R)/2}" y="${H-10}" font-size="13" font-weight="700" text-anchor="middle" fill="#1c1235">${esc(sp.xl||'')}</text><text transform="translate(15 ${(T+H-B)/2}) rotate(-90)" font-size="13" font-weight="700" text-anchor="middle" fill="#1c1235">${esc(sp.yl||'')}</text></svg>`;
  let leg='';if((sp.series||[]).length>1||sp.legend)leg=`<div class="legend">${sp.series.map(se=>`<span><i style="background:${se.c||'#6d3fb5'}"></i>${esc(se.n||'')}</span>`).join('')}</div>`;
  return `<div class="chart">${sp.title?`<b class="small" style="display:block;padding:4px 8px;color:#4b2575">${esc(sp.title)}</b>`:''}${s}${leg}</div>`;
}
function tableHTML(t){return `<div class="tablewrap"><table class="data"><thead><tr>${t[0].map(c=>`<th>${rt(c)}</th>`).join('')}</tr></thead><tbody>${t.slice(1).map(r=>`<tr>${r.map(c=>`<td>${rt(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}

/* ===== drag/drop + tap placement helper ===== */
function DnD(root,onChange){
  const chips=$$('.chipd',root),targets=$$('[data-target]',root),bank=$('.bank',root);
  const place={};let sel=null,locked=false,dragged=false;
  const tOf=id=>targets.find(t=>t.dataset.target===id);
  const cap=t=>parseInt(t.dataset.cap||'1',10);
  const holder=t=>$('.holder',t)||t;
  function occupants(t){return chips.filter(c=>place[c.dataset.chip]===t.dataset.target)}
  function put(chip,t){
    if(locked)return;
    const occ=occupants(t).filter(c=>c!==chip);
    if(occ.length>=cap(t)){if(cap(t)===1)occ.forEach(c=>delete place[c.dataset.chip]);else return}
    place[chip.dataset.chip]=t.dataset.target;sel=null;render();onChange&&onChange();
  }
  function render(){
    chips.forEach(c=>{
      const id=place[c.dataset.chip],t=id&&tOf(id),dest=t?holder(t):bank;
      if(c.parentNode!==dest)dest.appendChild(c);
      c.classList.toggle('sel',c===sel);
    });
    targets.forEach(t=>t.classList.toggle('target-ready',!!sel&&!locked));
  }
  chips.forEach(c=>{
    c.addEventListener('click',e=>{
      e.stopPropagation();if(dragged||locked){dragged=false;return}
      const id=place[c.dataset.chip];
      if(sel&&sel!==c&&id){put(sel,tOf(id));return}
      if(id&&!sel){delete place[c.dataset.chip];render();onChange&&onChange();return}
      sel=(sel===c)?null:c;render();
    });
    c.addEventListener('pointerdown',e=>{
      if(locked||e.button>0)return;
      const sx=e.clientX,sy=e.clientY;let ghost=null,over=null;
      const mv=ev=>{
        if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){ghost=c.cloneNode(true);ghost.classList.add('ghost');ghost.removeAttribute('id');document.body.appendChild(ghost);dragged=true}
        if(ghost){
          ghost.style.left=(ev.clientX-30)+'px';ghost.style.top=(ev.clientY-20)+'px';
          const el=document.elementFromPoint(ev.clientX,ev.clientY),t=el&&el.closest('[data-target]');
          if(over&&over!==t)over.classList.remove('over');
          over=t&&root.contains(t)?t:null;if(over)over.classList.add('over');
        }
      };
      const up=ev=>{
        document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
        if(ghost){ghost.remove();if(over){over.classList.remove('over');put(c,over)}else{const el=document.elementFromPoint(ev.clientX,ev.clientY);if(el&&bank&&bank.contains(el)){delete place[c.dataset.chip];render();onChange&&onChange()}}setTimeout(()=>dragged=false,30)}
      };
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
    });
  });
  targets.forEach(t=>{
    const act=()=>{if(sel&&!locked)put(sel,t)};
    t.addEventListener('click',act);
    t.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===t){e.preventDefault();act()}});
  });
  if(bank)bank.addEventListener('click',()=>{if(sel){delete place[sel.dataset.chip];sel=null;render();onChange&&onChange()}});
  render();
  return{place,chips,targets,occupants,render,
    reset(){Object.keys(place).forEach(k=>delete place[k]);sel=null;locked=false;chips.forEach(c=>c.classList.remove('right','wrong'));targets.forEach(t=>t.classList.remove('right','wrong'));render()},
    lock(v=true){locked=v;sel=null;render()},
    allPlaced(){return chips.every(c=>place[c.dataset.chip])}};
}
const chipHTML=(id,txt)=>`<button type="button" class="chipd" data-chip="${esc(id)}">${esc(txt)}</button>`;

/* ===== question engine ===== */
const FIG={};   // figure generators registered by sims.js
function aoTag(ao){return `<span class="tag-ao a${ao}" title="${['','Knowledge and understanding','Application','Analysis and evaluation'][ao]}">AO${ao}</span>`}
function marksOf(q){
  switch(q.t){
    case 'mcq':case 'tf':case 'num':case 'word':return 1;
    case 'multi':return q.a.length;
    case 'gap':return q.a.length;
    case 'match':return q.pairs.length;
    case 'order':return q.items.length;
    case 'build':return q.left.length+q.right.length;
    case 'sort':return q.items.length;
    case 'label':return q.spots.length;
    case 'w':return q.marks;
  }
  return 1;
}
function qMedia(q){
  let s='';
  if(q.chart)s+=chart(q.chart);
  if(q.fig&&q.t!=='label'&&FIG[q.fig])s+=`<div class="diagram" style="max-width:${q.figw||440}px">${FIG[q.fig](q.figopt||{})}</div>`;
  if(q.table)s+=tableHTML(q.table);
  return s?`<div class="qmedia" style="margin:8px 0 12px">${s}</div>`:'';
}
function qHTML(q,o={}){
  const marks=marksOf(q);
  const meta=`<div class="meta">${aoTag(q.ao)}<span class="tag-ao tag-mk">${marks} mark${marks>1?'s':''}</span>${q.s?'<span class="tag-ao tag-st">★ Stretch</span>':''}${o.showMod?`<span class="tag-ao tag-mk">Module ${q.m}</span>`:''}</div>`;
  let body='';
  const R=RENDER[q.t];body=R.html(q);
  const hint=(q.h&&!o.noHint)?`<details class="hint"><summary>Need a hint?</summary><div>${rt(q.h)}</div></details>`:'';
  const btn=o.defer?'Lock in answer':'Check answer';
  return `<article class="q ao${q.ao}" data-qid="${q.id}">${meta}<div class="qt">${rt(q.q)}</div>${qMedia(q)}<div class="qbody">${body}</div><div class="row" style="margin-top:12px"><button class="btn purple chk" type="button">${btn}</button><button class="btn retry hide" type="button">Try again</button></div>${hint}<div class="fb hide" role="status" aria-live="polite"></div></article>`;
}
/* bindQ: returns controller. cb(result) when checked. */
function bindQ(card,q,o={}){
  const T=RENDER[q.t],ctl=T.bind(card,q);
  const chk=$('.chk',card),retry=$('.retry',card),fb=$('.fb',card);
  let done=false,res=null;
  function show(r){
    const full=r.earned===r.of;
    fb.className='fb '+(full?'ok':r.earned>0?'part':'bad');
    fb.innerHTML=`<b class="h">${full?'✔ Correct!':r.earned>0?`◐ Part right – ${r.earned}/${r.of}`:'✘ Not quite'}</b>${r.detail||''}<div>${rt(q.e||'')}</div>`;
    if(!full&&q.h){fb.innerHTML+=`<div class="small" style="margin-top:6px"><i>Tip: ${rt(q.h)}</i></div>`}
  }
  chk.addEventListener('click',()=>{
    if(done)return;
    const r=ctl.check();if(!r)return;
    done=true;res=r;ctl.lock();chk.classList.add('hide');
    if(!o.noRecord)recordQ(q,r.earned,r.of);

function runQuiz(host,qs,o){

  const total=qs.length;

    if(i>=total){finish();return}
    const q=qs[i];
    host.innerHTML=`<div class="card alt" style="margin-bottom:14px"><div class="row"><b>${esc(o.title||'Quiz')}</b><span class="sp"></span><span class="badge-chip">Question ${i+1} of ${total}</span></div><div class="bar thin" style="margin-top:8px"><i style="width:${Math.round(100*i/total)}%"></i></div></div><div id="qslot">${qHTML(q,{defer:o.defer,showMod:o.showMod})}</div><div class="row hide" id="nx" style="margin-top:4px"><button class="btn primary" type="button">${i+1<total?'Next question →':'See my results →'}</button></div>`;
    const card=$('.q',host);
    bindQ(card,q,{defer:o.defer,noRetry:true,cb:r=>{earned+=r.earned;of+=r.of;results.push({q,r});$('#nx',host).classList.remove('hide');$('#nx button',host).focus()}});
    window.scrollTo({top:Math.max(0,host.getBoundingClientRect().top+scrollY-80),behavior:reduced()?'auto':'smooth'});
  }
  if(host._rq)host.removeEventListener('click',host._rq);
  host._rq=e=>{const b=e.target.closest('#nx button');if(b){i++;step()}};host.addEventListener('click',host._rq);
  function finish(){o.onFinish(results,earned,of)}
  step();

function breakdown(results){
  const mods={},aos={};

 <tr><td>Energy released</td><td>A lot</td><td>Much less</td></tr>
 <tr><td>When?</td><td>Rest and gentle exercise</td><td>Short bursts of very hard exercise, when oxygen cannot reach the muscles fast enough</td></tr></tbody></table></div>`},
 {h:'Lactic acid and oxygen debt',html:`<p>[[lactic acid|Lactic acid]] builds up in the muscles during hard exercise. It makes muscles ache and tire.</p><p>When you stop, you keep <b>breathing fast and deeply</b> and your heart keeps beating fast. The extra [[oxygen]] is used to break down the lactic acid. This extra oxygen is the <b>[[oxygen debt]]</b>. When it has been repaid, breathing and heart rate return to normal.</p>
 <div class="callout"><b class="t">Teacher check</b>“Oxygen debt” is used here because it appears in the Year 8 test context. Please check it matches the vocabulary in your Lesson 6–7 slides.</div>`}
 ]},
/* ---------------- MODULE 6 ---------------- */
{n:6,title:'Fermentation and Investigations',short:'Fermentation',icon:'flask',src:'Lesson 8 (untitled) – check',
 blurb:'Anaerobic respiration in yeast, the effect of temperature, and respiration in germinating seeds.',
 big:'Yeast can respire without oxygen. This is called fermentation, and it makes ethanol and carbon dioxide.',
 explore:[{id:'sim',t:'Yeast fermentation simulator'},{id:'graph',t:'Plot your results'},{id:'vars',t:'Variables challenge'},{id:'seeds',t:'Germinating seeds investigation'},{id:'eq',t:'Fermentation equation'}],
 kw:['fermentation','yeast','ethanol','glucose','variable','independent variable','dependent variable','control variable','hydrogencarbonate indicator','germination','control'],
 learn:[
 {h:'Fermentation',html:`<p>[[yeast|Yeast]] is a single-celled fungus. When it has no oxygen it respires anaerobically. This is called <b>[[fermentation]]</b>.</p>
 <div class="eq" style="color:#4b2575"><span>glucose</span><span class="op">→</span><span>[[ethanol]]</span><span class="op">+</span><span>carbon dioxide</span></div>
 <ul class="tick"><li><b>Bread:</b> the carbon dioxide makes bubbles that make the dough rise.</li><li><b>Brewing:</b> the ethanol is the alcohol in drinks.</li></ul>`},
 {h:'Investigating temperature',html:`<p>Pupils counted the <b>bubbles of carbon dioxide</b> made by yeast, glucose and warm water at different temperatures.</p>
 <div class="tablewrap"><table class="t"><thead><tr><th>Type of variable</th><th>In this investigation</th></tr></thead><tbody>
 <tr><td>[[independent variable|Independent]] (change)</td><td>Temperature</td></tr>
 <tr><td>[[dependent variable|Dependent]] (measure)</td><td>Number of bubbles per minute</td></tr>
 <tr><td>[[control variable|Control]] (keep the same)</td><td>Mass of yeast · volume and concentration of glucose solution · volume of water · time counted · same apparatus</td></tr></tbody></table></div>
 <ul class="tick"><li><b>Glucose</b> is added because it is the reactant (the “food”) that yeast ferment to release energy.</li><li>Fermentation speeds up as temperature rises, up to a best temperature (about 35–40 °C).</li><li>Above that, it slows and stops because the heat damages the yeast.</li><li>Repeating and finding a [[mean]] makes results more [[reliable]].</li></ul>`},
 {h:'Respiration in germinating seeds',html:`<p>A germinating seed is growing quickly, so it respires quickly. [[hydrogencarbonate indicator|Hydrogencarbonate indicator]] is <b>red</b> in normal air and turns <b>yellow</b> when there is more carbon dioxide.</p>
 <div class="diagram" style="max-width:420px;margin:8px auto">{{fig:seeds}}</div>
 <ul class="tick"><li><b>Tube A</b> (living, germinating seeds): the seeds respire → carbon dioxide is released → indicator turns yellow.</li><li><b>Tube B</b> (heat-killed seeds): dead seeds cannot respire → no carbon dioxide → indicator stays red.</li><li>Tube B is a [[control|control]]: it shows the colour change is caused by <b>living</b> seeds respiring.</li></ul>
 <div class="callout"><b class="t">Teacher check</b>Please check the fermentation, temperature and seed-investigation wording against your Lesson 8 materials (the page title was blank in the PDF). All numbers in the simulators are illustrative.</div>`}
 ]},

{n:7,title:'Scientific Skills and Exam Preparation',short:'Skills',icon:'chart',src:'Assessment skills grid + test',
 blurb:'Graphs, patterns, evidence, evaluating methods and writing the right number of points for the marks.',
 big:'Use the data, name the pattern, give the reason, and make as many separate points as there are marks.',
 explore:[{id:'reader',t:'Graph reader'},{id:'corr',t:'Correlation spotter'},{id:'cmd',t:'Command words'},{id:'marks',t:'How many marks?'}],
 kw:['correlation','anomaly','command word','reliable','mean','variable'],
 learn:[
 {h:'Reading graphs and tables',html:`<ul class="tick"><li>Read the <b>title</b> and both <b>axis labels and units</b>.</li><li>Check the <b>scale</b>: how much does one small square stand for?</li><li>To read a value, go across or up from the axis to the line or point, then to the other axis.</li><li>Always write the <b>unit</b> (cm, litres, bpm, °C).</li></ul>`},
 {h:'Describing patterns',html:`<p>A [[correlation]] is a link between two variables.</p><ul class="tick"><li><b>Positive:</b> as <i>x</i> increases, <i>y</i> increases.</li><li><b>Negative:</b> as <i>x</i> increases, <i>y</i> decreases.</li><li><b>No correlation:</b> no clear pattern.</li><li>An [[anomaly|anomalous result]] (outlier) does not fit the pattern. Point it out and suggest why it might happen.</li></ul>
 <div class="starters"><span class="pill">As … increases, … increases.</span><span class="pill">The evidence suggests that …</span><span class="pill">This is a positive correlation because …</span></div>`},
 {h:'Command words and marks',html:`<div class="tablewrap"><table class="t"><thead><tr><th>Command word</th><th>What to do</th></tr></thead><tbody><tr><td>State / Name / Give</td><td>Write a short fact. One point.</td></tr><tr><td>Describe</td><td>Say what happens or what the pattern is. Use data.</td></tr><tr><td>Explain</td><td>Give the reason. Use <b>because</b> and link ideas together.</td></tr><tr><td>Predict</td><td>Say what you think will happen, then use science to justify it.</td></tr><tr><td>Evaluate / Suggest improvements</td><td>Say what was good, what was not, and how to improve it.</td></tr></tbody></table></div>
 <div class="callout teal"><b class="t">Marks = points</b>A 3-mark question needs <b>3 separate scientific points</b>. For “explain” questions, link the points: <i>This happens because … so …</i></div>`},
 {h:'Evaluating investigations',html:`<ul class="tick"><li><b>Fair test:</b> change one variable, keep the others the same.</li><li><b>Repeat</b> and calculate a [[mean]] → more [[reliable]] results.</li><li>Use a <b>control</b> to show what caused the change.</li><li>Take <b>more readings</b> across the range, and measure accurately (a longer counting time, a better instrument).</li></ul>
 <div class="starters"><span class="pill">This happens because the pressure …</span><span class="pill">The rate of diffusion increases because …</span><span class="pill">A better method would be to … because …</span></div>`}
 ]}
];

{id:'m2p02',m:2,ao:1,t:'tf',q:'When we inhale, the diaphragm relaxes and moves upwards.',a:false,e:'When we inhale the diaphragm **contracts** and **flattens** (moves down). It relaxes and domes when we exhale.'},

{id:'m2w02',m:2,ao:3,t:'w',marks:2,q:'Evaluate the bell-jar lung model: give one way it is a good model and one limitation.',st:['The model shows well that …','A limitation is that …'],model:'Good: changing the volume of the jar (by moving the rubber sheet, like the diaphragm) changes the pressure so air moves in and out of the balloons. Limitation: the bell jar is rigid but the real rib cage moves / it has no intercostal muscles / the rubber sheet is not like a real diaphragm / real lungs are not simple balloons.',pts:['One valid strength (e.g. changing volume changes how air moves; the rubber sheet is linked to breathing)','One valid limitation (e.g. rigid jar, no ribs or intercostal muscles, lungs are not hollow balloons)'],kw:['volume','pressure','rigid','ribs'],imp:'“Evaluate” needs a good point and a bad point. Say specifically which part of the model is unrealistic.'},

{id:'m3p02',m:3,ao:1,t:'tf',q:'Carbon dioxide diffuses from the air in the alveoli into the blood.',a:false,e:'It is the other way round: carbon dioxide diffuses from the **blood** into the **alveoli** and is then breathed out.'},
{id:'m3p03',m:3,ao:1,t:'gap',q:'Complete the definition of diffusion.',g:'Diffusion is the movement of particles from an area of {0} concentration to an area of {1} concentration.',bank:['high','low','equal'],a:['high','low'],e:'Particles diffuse down a concentration gradient, from high to low.'},
{id:'m3p04',m:3,ao:1,t:'multi',q:'Which THREE features make the alveoli good at gas exchange?',o:['Walls only one cell thick','A very large surface area','A rich blood supply','Thick walls made of muscle','A dry lining'],a:[0,1,2],e:'Thin walls (short diffusion distance), large surface area and a rich blood supply (keeps the gradient steep). A moist lining also helps.'},
{id:'m3p05',m:3,ao:1,t:'match',q:'Match each adaptation to how it helps gas exchange.',pairs:[['Walls one cell thick','Short distance for gases to diffuse'],['Millions of alveoli','Large surface area for diffusion'],['Network of capillaries','Blood carries gases away, keeping the gradient steep'],['Breathing in and out','Brings fresh oxygen in and removes carbon dioxide']],e:'Each adaptation either shortens the diffusion distance, increases the surface area or keeps the concentration gradient steep.'},
{id:'m3p06',m:3,ao:2,t:'mcq',q:'Why does oxygen diffuse from the alveolus into the blood?',o:['The concentration of oxygen is higher in the alveolus than in the blood','The concentration of oxygen is lower in the alveolus than in the blood','The blood pumps oxygen out of the alveolus','The alveolus wall is a muscle that squeezes oxygen in'],a:0,e:'Particles diffuse from high to low concentration. Breathing keeps the oxygen concentration in the alveolus high; the blood arriving has low oxygen.'},
{id:'m3p07',m:3,ao:2,t:'mcq',q:'The wall of a capillary is only one cell thick. How does this help gas exchange?',o:['Gases have a very short distance to diffuse','It gives the capillary a larger volume','It stops the blood flowing','It makes the blood warmer'],a:0,e:'A very thin wall means a short diffusion distance, so gases pass across quickly.'},
{id:'m3p08',m:3,ao:2,t:'mcq',q:'During an asthma attack, the airways become narrower. Why does this make breathing difficult?',o:['Less air can pass through to the alveoli','The alveoli stop working','The diaphragm stops contracting','The blood contains less oxygen to start with'],a:0,e:'Narrow airways restrict the flow of air, so less oxygen reaches the alveoli.'},
{id:'m3p09',m:3,ao:3,t:'num',q:'Use the graph to find the percentage of normal oxygen absorbed after 20 years of smoking.',chart:SMOKE_CHART,a:80,tol:2,u:'%',e:'Go up from 20 years to the line, then across to the axis: 80%.'},
{id:'m3p10',m:3,ao:3,t:'mcq',q:'What does the graph show about smoking and oxygen absorption?',chart:SMOKE_CHART,o:['The longer someone smokes, the less oxygen is absorbed','The longer someone smokes, the more oxygen is absorbed','Smoking has no effect on oxygen absorption','Oxygen absorption falls only after 30 years'],a:0,e:'It is a negative correlation: as years of smoking increase, oxygen absorbed decreases. (The data are illustrative.)',h:'Read the axes, then describe how the line moves.'},
{id:'m3w01',m:3,ao:2,t:'w',marks:3,q:'The walls of the alveoli in a smoker’s lungs have broken down, leaving fewer, larger air spaces. Explain why the smoker often feels out of breath.',st:['The surface area of the alveoli …','So less oxygen …','This means …'],model:'The breakdown of the walls reduces the surface area of the alveoli, so less oxygen can diffuse into the blood (and less carbon dioxide out). The cells receive less oxygen for respiration, so the person feels breathless and tired.',pts:['Alveoli walls break down so the surface area is smaller','Less oxygen diffuses into the blood (less gas exchange)','Cells get less oxygen for respiration, so the person feels breathless/tired'],kw:['surface area','oxygen','diffuse','respiration'],imp:'Link the damage to surface area, then to less oxygen, then to the effect on the person.'},
{id:'m3w02',m:3,ao:2,t:'w',marks:2,q:'Explain why having millions of alveoli helps gas exchange.',st:['There are millions of alveoli so …','This means more …'],model:'Millions of alveoli give the lungs a very large surface area, so more oxygen can diffuse into the blood (and more carbon dioxide out) at the same time.',pts:['Large surface area','So more oxygen/gas can diffuse across at once (faster gas exchange)'],kw:['surface area','diffuse'],imp:'Name the adaptation (large surface area), then say what difference it makes (faster, more diffusion).'},
{id:'m3c01',m:3,ao:1,chk:1,t:'mcq',q:'Which gas is made by respiration and moves from the blood into the alveoli?',o:['Carbon dioxide','Oxygen','Nitrogen','Hydrogen'],a:0,e:'Carbon dioxide diffuses from the blood into the alveoli and is breathed out.'},
{id:'m3c02',m:3,ao:1,chk:1,t:'tf',q:'The walls of capillaries around the alveoli are only one cell thick.',a:true,e:'This gives a short diffusion distance.'},
{id:'m3c03',m:3,ao:2,chk:1,t:'mcq',q:'Air in the alveoli has a higher concentration of oxygen than the blood arriving at the lungs. What does this create?',o:['A concentration gradient','A pressure gradient','A temperature gradient','A magnetic field'],a:0,e:'A concentration gradient is a difference in concentration. It makes oxygen diffuse into the blood.'},
{id:'m3c04',m:3,ao:1,chk:1,t:'mcq',q:'Which substance in cigarette smoke is addictive?',o:['Nicotine','Tar','Carbon monoxide','Oxygen'],a:0,e:'Nicotine is addictive. Tar damages the airways and carbon monoxide reduces the oxygen the blood can carry.'},
{id:'m3c05',m:3,ao:2,chk:1,t:'mcq',q:'Why might a person with damaged alveoli feel tired easily?',o:['Less oxygen reaches the blood, so less respiration can happen in cells','More oxygen reaches the blood','The diaphragm stops moving','The blood becomes thicker'],a:0,e:'Less surface area means less oxygen diffuses into the blood, so cells cannot release as much energy.'},
{id:'m3c06',m:3,ao:3,chk:1,t:'mcq',q:'An asthma inhaler contains medicine that relaxes the muscles around the airways. What is the effect?',o:['The airways widen so more air can reach the alveoli','The airways get narrower','The alveoli grow bigger','The ribs move further'],a:0,e:'Relaxed muscles allow the bronchioles to widen, so air flows more easily.'},
{id:'m3x01',m:3,ex:1,ao:1,t:'sort',q:'Sort the statements about gas exchange into the correct box.',bins:['Oxygen','Carbon dioxide'],items:[['Diffuses from the alveoli into the blood',0],['Diffuses from the blood into the alveoli',1],['Is breathed out',1],['Is carried round the body in the blood to the cells',0],['Is a waste product of respiration',1],['Is used by cells for aerobic respiration',0]],e:'Oxygen goes into the blood to be used in respiration; carbon dioxide is the waste product that is breathed out.'},

/* ================= MODULE 4 ================= */
{id:'m4p01',m:4,ao:1,t:'gap',q:'Complete the sentence.',g:'Respiration is a chemical reaction that releases {0} from {1}.',bank:['energy','glucose','oxygen','heat','carbon dioxide'],a:['energy','glucose'],e:'Respiration releases energy from glucose in every living cell.'},
{id:'m4p02',m:4,ao:1,t:'build',q:'Build the word equation for aerobic respiration.',left:['glucose','oxygen'],right:['carbon dioxide','water'],chips:['glucose','oxygen','carbon dioxide','water','energy','lactic acid','ethanol'],e:'Aerobic respiration: glucose + oxygen → carbon dioxide + water. Energy is released, but it is not a substance, so it is not written in the equation.'},
{id:'m4p03',m:4,ao:1,t:'sort',q:'Sort these into reactants and products of aerobic respiration.',bins:['Reactant (used up)','Product (made)'],items:[['Glucose',0],['Oxygen',0],['Carbon dioxide',1],['Water',1]],e:'Reactants are on the left of the arrow, products on the right.'},
{id:'m4p04',m:4,ao:1,t:'sort',q:'Is each statement about VENTILATION, GAS EXCHANGE or RESPIRATION?',bins:['Ventilation','Gas exchange','Respiration'],items:[['Air moves in and out of the lungs',0],['Oxygen diffuses into the blood in the alveoli',1],['Glucose is used to release energy',2],['Happens in every living cell',2],['Caused by changes in chest volume and pressure',0],['Carbon dioxide diffuses from the blood into the alveoli',1]],e:'Ventilation = moving air (physical). Gas exchange = diffusion between air and blood. Respiration = chemical reaction in cells.'},
{id:'m4p05',m:4,ao:1,t:'multi',q:'Which FOUR of these use energy released by respiration?',o:['Muscles contracting','Keeping the body warm','Growing and making new cells','Sending nerve impulses','Making oxygen','Making glucose from air'],a:[0,1,2,3],e:'Cells use energy for movement, warmth, growth and sending nerve impulses. Respiration does not make oxygen or glucose.'},
{id:'m4p06',m:4,ao:2,t:'mcq',q:'A runner eats pasta. How does the glucose reach her muscle cells?',o:['Digestion releases glucose, which is absorbed into the blood and carried to the cells','It is made in the lungs from oxygen','It is breathed in from the air','It is made by the diaphragm'],a:0,e:'Carbohydrates in food are digested to glucose, absorbed into the blood and carried to every cell.'},
{id:'m4p07',m:4,ao:2,t:'mcq',q:'Why do cells need a continuous supply of oxygen?',o:['To release energy from glucose by aerobic respiration','To make glucose','To make carbon dioxide for the plants','To keep the alveoli open'],a:0,e:'Aerobic respiration needs oxygen to release energy from glucose.'},
{id:'m4p08',m:4,ao:2,t:'tf',q:'Plants only respire at night.',a:false,e:'Plants respire all the time, day and night. In the day they also photosynthesise.'},
{id:'m4p09',m:4,ao:3,s:1,t:'mcq',q:'A pupil writes: “glucose + oxygen → carbon dioxide + water + energy”. Which comment is best?',o:['Energy is not a substance, so it is released rather than written as a product','Energy should be written as a reactant','The equation is wrong because water is not a product','The equation should have nitrogen in it'],a:0,e:'Energy is transferred, not made as a chemical. In a word equation we write only substances.'},
{id:'m4w01',m:4,ao:2,t:'w',marks:2,q:'Explain the difference between breathing and respiration.',st:['Breathing is …','Respiration is …'],model:'Breathing (ventilation) is moving air into and out of the lungs – a physical process. Respiration is a chemical reaction in cells that releases energy from glucose, using oxygen and producing carbon dioxide and water.',pts:['Breathing = moving air in and out of the lungs (physical)','Respiration = chemical reaction in cells that releases energy from glucose'],kw:['lungs','chemical','cells','energy','glucose'],imp:'Say where each one happens and whether it is physical or chemical.'},
{id:'m4w02',m:4,ao:1,t:'w',marks:2,q:'Name the two reactants in aerobic respiration.',model:'Glucose and oxygen.',pts:['Glucose','Oxygen'],kw:['glucose','oxygen'],imp:'Reactants are on the left of the equation: glucose + oxygen.'},
{id:'m4c01',m:4,ao:1,chk:1,t:'mcq',q:'Why do living things respire?',o:['To release energy','To make oxygen','To make carbon dioxide for plants','To cool down'],a:0,e:'Respiration releases the energy that cells need for life processes.'},
{id:'m4c02',m:4,ao:1,chk:1,t:'word',q:'Name the gas that is used up in aerobic respiration.',a:['oxygen'],e:'Aerobic respiration uses oxygen.'},
{id:'m4c03',m:4,ao:1,chk:1,t:'mcq',q:'Complete the equation: glucose + ______ → carbon dioxide + water',o:['oxygen','ethanol','lactic acid','energy'],a:0,e:'Aerobic respiration: glucose + oxygen → carbon dioxide + water.'},
{id:'m4c04',m:4,ao:2,chk:1,t:'mcq',q:'Which process is a chemical reaction that takes place inside cells?',o:['Respiration','Ventilation','Diffusion in the alveoli','Inhalation'],a:0,e:'Respiration is a chemical reaction. Ventilation and diffusion are physical processes.'},
{id:'m4c05',m:4,ao:2,chk:1,t:'mcq',q:'What happens to the carbon dioxide made by respiration in a muscle cell?',o:['It is carried by the blood to the lungs and breathed out','It stays in the cell for ever','It is turned into oxygen','It is stored in the alveoli'],a:0,e:'Carbon dioxide diffuses into the blood, is carried to the lungs, diffuses into the alveoli and is breathed out.'},
{id:'m4x01',m:4,ex:1,ao:1,t:'sort',q:'Is the energy for this activity supplied by respiration in the body?',bins:['Yes – powered by respiration','No'],items:[['Muscles contracting to kick a ball',0],['Keeping body temperature at 37 °C',0],['A cell dividing to make a new cell',0],['A nerve cell sending an impulse',0],['A car engine burning petrol',1],['A phone battery charging',1]],e:'Living cells release energy by respiration. Car engines and batteries are not living cells.'},

/* ================= MODULE 5 ================= */
{id:'m5p01',m:5,ao:1,t:'mcq',q:'What happens to heart rate during exercise?',o:['It increases','It decreases','It stays the same','It stops'],a:0,e:'The heart beats faster to carry more oxygen and glucose to the muscles.'},
{id:'m5p02',m:5,ao:1,t:'gap',q:'Complete the explanation.',g:'During exercise the muscles respire {0}, so they need more oxygen and {1}. The {2} rate and heart rate both increase to deliver them.',bank:['faster','glucose','breathing','slower','digestion'],a:['faster','glucose','breathing'],e:'More respiration means more oxygen and glucose are needed.'},
{id:'m5p03',m:5,ao:1,t:'sort',q:'Sort the statements into aerobic or anaerobic respiration.',bins:['Aerobic respiration','Anaerobic respiration (in muscles)'],items:[['Uses oxygen',0],['Makes lactic acid',1],['Makes carbon dioxide and water',0],['Releases much less energy from each glucose',1],['Happens when oxygen cannot reach the muscles fast enough',1],['Happens at rest and during gentle exercise',0]],e:'Aerobic respiration needs oxygen. Anaerobic respiration happens without oxygen and in muscles produces lactic acid.'},
{id:'m5p04',m:5,ao:1,t:'build',q:'Build the word equation for anaerobic respiration in human muscles.',left:['glucose'],right:['lactic acid'],chips:['glucose','lactic acid','oxygen','carbon dioxide','ethanol','water'],e:'Anaerobic respiration in muscles: glucose → lactic acid (and less energy is released).'},
{id:'m5p05',m:5,ao:3,t:'num',q:'What was the maximum heart rate shown on the graph?',chart:HR_CHART,a:160,tol:2,u:'beats per minute',e:'The highest point on the line is 160 beats per minute.'},
{id:'m5p06',m:5,ao:3,t:'num',q:'Read the graph: what was the resting heart rate before exercise started (at 0 minutes)?',chart:HR_CHART,a:70,tol:3,u:'beats per minute',e:'At 0 minutes the line is at 70 beats per minute.'},
{id:'m5p07',m:5,ao:3,t:'mcq',q:'Which statement best describes the heart rate between 2 and 8 minutes?',chart:HR_CHART,o:['It increased quickly at first, then more slowly, as exercise started','It stayed constant','It decreased steadily','It increased at the same rate throughout'],a:0,e:'The graph is steep from about 2 to 5 minutes, then flattens out as it approaches 160.'},
{id:'m5p08',m:5,ao:3,s:1,t:'mcq',q:'Exercise stops at 10 minutes, but the heart rate takes several minutes to fall back to its resting value. What is the best explanation?',chart:HR_CHART,o:['The body still needs extra oxygen to break down the lactic acid that built up','The muscles have stopped respiring','The heart is damaged','The lungs have stopped working'],a:0,e:'The extra oxygen needed to break down lactic acid (the oxygen debt) is delivered by a fast heart rate and fast breathing until the debt is repaid.'},
{id:'m5p09',m:5,ao:2,t:'mcq',q:'Why do muscles ache after a sprint?',o:['Lactic acid has built up from anaerobic respiration','Carbon dioxide has built up from photosynthesis','They have run out of water','Oxygen has gone into them'],a:0,e:'In a sprint, oxygen cannot reach the muscles fast enough, so some anaerobic respiration happens and lactic acid builds up.'},
{id:'m5p10',m:5,ao:2,t:'mcq',q:'A sprinter and a person on a gentle walk are compared. Who is more likely to make lactic acid, and why?',o:['The sprinter, because oxygen cannot be supplied fast enough for aerobic respiration alone','The walker, because walking is anaerobic','Both the same','Neither – lactic acid is only made by plants'],a:0,e:'Intense exercise uses energy faster than the blood can deliver oxygen, so muscles also respire anaerobically.'},
{id:'m5p11',m:5,ao:2,s:1,t:'order',q:'Put these events in order for a swimmer during and after a short, fast race.',items:['Muscles respire anaerobically as oxygen cannot be supplied fast enough','Lactic acid builds up in the muscles','The race ends','Breathing stays fast and deep','Extra oxygen is used to break down the lactic acid','Breathing rate and heart rate return to normal'],e:'The oxygen debt is repaid after the race, so breathing stays fast until the lactic acid has been broken down.'},
{id:'m5w01',m:5,ao:2,t:'w',marks:3,q:'A swimmer finishes a 50 m race and continues to breathe deeply and quickly for several minutes. Explain why.',st:['During the race the muscles …','Lactic acid …','The extra oxygen is used to …'],model:'During the race the muscles respire anaerobically as oxygen cannot be supplied fast enough, so lactic acid builds up. After the race, extra oxygen is needed to break down the lactic acid (repay the oxygen debt). Breathing stays fast and deep until this is done.',pts:['Muscles respired anaerobically during the race and lactic acid built up','Extra oxygen is needed to break down the lactic acid (oxygen debt)','So breathing rate/depth stays high until the oxygen debt is repaid'],kw:['anaerobic','lactic acid','oxygen debt','breathing'],imp:'Start in the race (anaerobic → lactic acid), then explain what the extra oxygen is for.'},
{id:'m5w02',m:5,ao:2,t:'w',marks:3,q:'Explain why both breathing rate and heart rate increase during exercise.',st:['The muscles respire faster so …','Breathing faster …','A faster heart rate …'],model:'The muscles respire faster so they need more oxygen and glucose and produce more carbon dioxide. Breathing faster brings more oxygen into the blood and removes more carbon dioxide. A faster heart rate carries oxygen and glucose to the muscles more quickly and takes carbon dioxide away.',pts:['Muscles respire faster so need more oxygen and glucose','Faster/deeper breathing takes in more oxygen (and removes more carbon dioxide)','Faster heart rate delivers oxygen and glucose to the muscles more quickly'],kw:['respire','oxygen','glucose','carbon dioxide','blood'],imp:'Give the reason first (more respiration), then say what each change does.'},
{id:'m5c01',m:5,ao:1,chk:1,t:'mcq',q:'What is made in human muscles during anaerobic respiration?',o:['Lactic acid','Ethanol','Oxygen','Glucose'],a:0,e:'Anaerobic respiration in muscles makes lactic acid.'},
{id:'m5c02',m:5,ao:1,chk:1,t:'tf',q:'Anaerobic respiration needs oxygen.',a:false,e:'“Anaerobic” means without oxygen.'},
{id:'m5c03',m:5,ao:2,chk:1,t:'mcq',q:'Why does breathing rate increase during exercise?',o:['More oxygen is needed for respiration and more carbon dioxide must be removed','Less oxygen is needed','The lungs are bigger','To cool the heart'],a:0,e:'Faster respiration needs more oxygen and produces more carbon dioxide.'},
{id:'m5c04',m:5,ao:1,chk:1,t:'mcq',q:'Which term describes the extra oxygen needed after hard exercise to break down lactic acid?',o:['Oxygen debt','Gas exchange','Ventilation','Fermentation'],a:0,e:'The oxygen debt is repaid after exercise by breathing deeply and quickly.'},
{id:'m5c05',m:5,ao:3,chk:1,t:'num',q:'How many times more lactic acid was in the muscle when sprinting than when resting?',chart:LACT_CHART,a:8,tol:0.1,u:'times',e:'Resting = 1 unit, sprinting = 8 units, so 8 times more.',h:'Divide the sprinting value by the resting value.'},
{id:'m5c06',m:5,ao:3,chk:1,t:'mcq',q:'What does the graph show?',chart:LACT_CHART,o:['The harder the activity, the more lactic acid is made','The harder the activity, the less lactic acid is made','Lactic acid is the same in all activities','Lactic acid is only made at rest'],a:0,e:'More intense exercise produces more anaerobic respiration, so more lactic acid.'},

{id:'m2x01',m:2,ex:1,ao:1,t:'order',q:'Sequence it: INHALATION. Tap the steps in order (steps 1–3 happen together).',items:['Intercostal muscles contract','Ribs move up and out','Diaphragm contracts and flattens','Chest volume increases','Pressure inside the lungs decreases','Air moves into the lungs'],eqv:[[0,1,2],[3],[4],[5]],e:'Muscles contract → volume increases → pressure decreases → air moves in.'},
{id:'m2x02',m:2,ex:1,ao:1,t:'order',q:'Sequence it: EXHALATION. Tap the steps in order (steps 1–3 happen together).',items:['Intercostal muscles relax','Ribs move down and in','Diaphragm relaxes and becomes dome-shaped','Chest volume decreases','Pressure inside the lungs increases','Air moves out of the lungs'],eqv:[[0,1,2],[3],[4],[5]],e:'Muscles relax → volume decreases → pressure increases → air moves out.'},
{id:'m2x03',m:2,ex:1,ao:2,t:'sort',q:'Compare inhalation and exhalation. Sort each feature.',bins:['Inhalation','Exhalation'],items:[['Intercostal muscles contract',0],['Ribs move down and in',1],['Diaphragm contracts and flattens',0],['Chest volume decreases',1],['Pressure in the lungs is lower than outside',0],['Air moves out of the lungs',1],['Diaphragm moves up into a dome',1],['Ribs move up and out',0]],e:'Inhalation and exhalation are opposites.'},
{id:'m4x02',m:4,ex:1,ao:1,t:'build',q:'Build the word equation for aerobic respiration.',left:['glucose','oxygen'],right:['carbon dioxide','water'],chips:['glucose','oxygen','carbon dioxide','water','energy','lactic acid','ethanol'],e:'glucose + oxygen → carbon dioxide + water. Energy is released but is not written in the equation.'},
{id:'m4x03',m:4,ex:1,ao:1,t:'sort',q:'Sort these into reactants (used) and products (made) in aerobic respiration.',bins:['Reactant (used up)','Product (made)'],items:[['Glucose',0],['Oxygen',0],['Carbon dioxide',1],['Water',1]],e:'Reactants go in; products come out.'},
{id:'m4x04',m:4,ex:1,ao:2,t:'sort',q:'Ventilation, gas exchange or respiration? Sort each statement.',bins:['Ventilation','Gas exchange','Respiration'],items:[['Chest volume and pressure change',0],['Oxygen diffuses across the alveolus wall',1],['A chemical reaction that releases energy',2],['Air moves in and out of the lungs',0],['Carbon dioxide diffuses out of the blood',1],['Takes place in the cells',2]],e:'Three different processes: do not mix them up.'},
{id:'m5x03',m:5,ex:1,ao:3,t:'mcq',q:'Predict: during a very fast sprint, what happens to the heart rate?',o:['It increases a lot','It decreases','It stays the same','It stops'],a:0,e:'The heart beats faster to deliver more oxygen and glucose to the muscles.'},
{id:'m5x04',m:5,ex:1,ao:3,t:'mcq',q:'Predict: during a very fast sprint, which type of respiration happens in the muscles?',o:['Aerobic, and also some anaerobic respiration','Anaerobic only, never aerobic','No respiration','Fermentation making ethanol'],a:0,e:'Aerobic respiration carries on, but when oxygen cannot be delivered fast enough some anaerobic respiration also happens, making lactic acid.'},
{id:'m5x06',m:5,ex:1,ao:1,t:'sort',q:'Compare the two types of respiration. Sort each statement.',bins:['Aerobic','Anaerobic (in muscles)'],items:[['Needs oxygen',0],['Makes lactic acid',1],['Releases more energy',0],['Releases less energy',1],['Glucose + oxygen → carbon dioxide + water',0],['Glucose → lactic acid',1]],e:'Aerobic uses oxygen and releases more energy. Anaerobic (in muscles) makes lactic acid and releases less.'},
{id:'m5x01',m:5,ex:1,ao:3,t:'num',q:'Use the heart-rate graph: how many minutes did it take for the heart rate to fall from its maximum (at minute 10) to 100 beats per minute?',chart:HR_CHART,a:3,tol:0.2,u:'minutes',e:'Heart rate was 160 at minute 10 and about 100 at minute 13, so it took 3 minutes.'},
{id:'m5x02',m:5,ex:1,ao:2,t:'mcq',q:'You sprint for the bus and stop. Which statement is correct?',o:['You keep breathing fast to take in extra oxygen to break down lactic acid','You breathe fast because your lungs are empty','You breathe fast because your heart has stopped','You breathe fast because carbon dioxide is needed'],a:0,e:'The oxygen debt must be repaid before breathing returns to normal.'},

/* ================= MODULE 6 ================= */
{id:'m6p01',m:6,ao:1,t:'build',q:'Build the word equation for fermentation in yeast.',left:['glucose'],right:['ethanol','carbon dioxide'],chips:['glucose','ethanol','carbon dioxide','lactic acid','oxygen','water'],e:'Fermentation: glucose → ethanol + carbon dioxide.'},
{id:'m6p02',m:6,ao:1,t:'mcq',q:'Which gas made by fermentation makes bread dough rise?',o:['Carbon dioxide','Oxygen','Ethanol','Nitrogen'],a:0,e:'Carbon dioxide forms bubbles in the dough that make it expand.'},
{id:'m6p03',m:6,ao:1,t:'tf',q:'Yeast is a type of bacterium.',a:false,e:'Yeast is a single-celled fungus.'},
{id:'m6p04',m:6,ao:2,t:'sort',q:'Sort the variables from a fermentation investigation into the correct box.',bins:['Independent variable (change)','Dependent variable (measure)','Control variable (keep the same)'],items:[['Temperature of the water bath',0],['Number of bubbles per minute',1],['Mass of yeast',2],['Volume of glucose solution',2],['Time the bubbles are counted for',2]],e:'Change temperature, measure bubbles, and keep everything else the same.'},
{id:'m6p05',m:6,ao:2,t:'mcq',q:'Why is glucose added to the yeast and water?',o:['Yeast need it as the reactant to ferment and release energy','To make the water sweeter','To cool the mixture down','To make the yeast die'],a:0,e:'Glucose is the substance that is broken down in fermentation. Without it, there would be nothing to ferment.'},
{id:'m6p06',m:6,ao:3,t:'mcq',q:'At which temperature was the rate of fermentation highest?',chart:FERM_CHART,o:['40 °C','30 °C','50 °C','60 °C'],a:0,e:'The highest point is at 40 °C (34 bubbles per minute).'},
{id:'m6p07',m:6,ao:3,t:'num',q:'How many more bubbles per minute were produced at 30 °C than at 10 °C?',chart:FERM_CHART,a:18,tol:1,u:'bubbles',e:'22 − 4 = 18 bubbles per minute.'},
{id:'m6p08',m:6,ao:3,s:1,t:'mcq',q:'The number of bubbles falls at 50 °C and 60 °C. What is the best explanation?',chart:FERM_CHART,o:['Too much heat damages the yeast so fermentation slows and stops','The glucose has become colder','Yeast respires faster at higher temperatures','The carbon dioxide is destroyed'],a:0,e:'Very high temperatures damage the yeast (its enzymes), so it cannot ferment as well.'},
{id:'m6p09',m:6,ao:2,t:'mcq',q:'What does it show when hydrogencarbonate indicator changes from red to yellow?',o:['More carbon dioxide is present','More oxygen is present','The temperature has fallen','Glucose has been used up'],a:0,e:'Hydrogencarbonate indicator is red in normal air and yellow when carbon dioxide has increased.'},
{id:'m6p10',m:6,ao:3,t:'mcq',q:'In the germinating-seed investigation, why is a tube of heat-killed seeds included?',o:['It is a control: it shows the colour change is caused by living seeds respiring','To make the experiment more difficult','To add extra carbon dioxide','To provide seeds for food'],a:0,e:'Heat-killed seeds cannot respire, so no carbon dioxide is made. If that tube stays red, the colour change in the other tube must be due to the living seeds.'},

{id:'m6w01',m:6,ao:2,t:'w',marks:2,q:'Explain why bread dough rises when yeast is added.',st:['The yeast respire anaerobically …','The carbon dioxide …'],model:'The yeast ferment the sugar (glucose) and produce carbon dioxide. The carbon dioxide forms bubbles that make the dough expand.',pts:['Yeast ferment (respire anaerobically) glucose/sugar and make carbon dioxide','The carbon dioxide gas forms bubbles that make the dough rise'],kw:['ferment','glucose','carbon dioxide','bubbles'],imp:'Name the process (fermentation) and the gas it makes (carbon dioxide).'},
{id:'m6w02',m:6,ao:3,t:'w',marks:3,q:'Explain why a tube of heat-killed seeds is included when investigating respiration in germinating seeds.',st:['The heat-killed seeds are a …','They cannot …','So if the indicator …'],model:'The heat-killed seeds are a control. They are dead, so they cannot respire and no carbon dioxide is produced, so the indicator stays red. This shows that the colour change in the other tube is caused by the living seeds respiring.',pts:['Heat-killed seeds are a control / comparison','They cannot respire so no carbon dioxide is made (indicator stays red)','So the colour change in the living-seed tube must be caused by respiration in the living seeds'],kw:['control','respire','carbon dioxide','red','living'],imp:'A control question needs: what the control is, what happens in it, and what that proves.'},

{id:'m6w04',m:6,ao:3,s:1,t:'w',marks:3,q:'Two tubes each contain germinating seeds in hydrogencarbonate indicator. Tube X is kept at 20 °C and tube Y at 5 °C. After one hour tube X is orange and tube Y is still red. Explain these results.',st:['The seeds in tube X respire …','At 5 °C …'],model:'The seeds respire in both tubes, but respiration is faster at 20 °C than at 5 °C. So more carbon dioxide was released in tube X, turning the indicator towards yellow (orange). In tube Y, less carbon dioxide was released, so the indicator stayed red.',pts:['Seeds respire faster at the higher temperature (20 °C)','More carbon dioxide is released in tube X','Indicator changes colour in X because of more carbon dioxide; less carbon dioxide in Y, so it stays red'],kw:['respire','carbon dioxide','temperature','indicator'],imp:'Link temperature → rate of respiration → carbon dioxide → colour.'},
{id:'m6c01',m:6,ao:1,chk:1,t:'mcq',q:'Which gas turns hydrogencarbonate indicator from red to yellow?',o:['Carbon dioxide','Oxygen','Nitrogen','Hydrogen'],a:0,e:'More carbon dioxide turns the indicator yellow.'},
{id:'m6c02',m:6,ao:1,chk:1,t:'tf',q:'Fermentation in yeast needs oxygen.',a:false,e:'Fermentation is anaerobic respiration: it happens without oxygen.'},
{id:'m6c03',m:6,ao:2,chk:1,t:'mcq',q:'Which two substances are made when yeast ferments glucose?',o:['Ethanol and carbon dioxide','Lactic acid and water','Oxygen and water','Glucose and ethanol'],a:0,e:'glucose → ethanol + carbon dioxide.'},

{id:'m6c05',m:6,ao:3,chk:1,t:'mcq',q:'Which change would make the fermentation investigation a fairer test?',o:['Use the same mass of yeast and volume of glucose solution each time','Use a different amount of yeast for each temperature','Change the temperature and the amount of glucose together','Count bubbles for different lengths of time'],a:0,e:'A fair test changes only one variable and keeps the others the same.'},
{id:'m6c06',m:6,ao:3,chk:1,t:'mcq',q:'Tube A (living germinating seeds) turns yellow; tube B (heat-killed seeds) stays red. What does this suggest?',o:['Living seeds respire and release carbon dioxide','Dead seeds respire faster','Both tubes had no carbon dioxide','Seeds make oxygen'],a:0,e:'Only the living seeds can respire, releasing carbon dioxide that changes the indicator.'},
{id:'m6x02',m:6,ex:1,ao:2,t:'sort',q:'Sort these variables from the yeast investigation.',bins:['Independent (change)','Dependent (measure)','Control (keep the same)'],items:[['Temperature of the water bath',0],['Bubbles counted in one minute',1],['Concentration of the glucose solution',2],['Volume of water in the flask',2],['Mass of yeast',2]],e:'Only one variable is changed (independent). One is measured (dependent). All others are controlled to keep it a fair test.'},

/* ===== loop helpers ===== */
let CLEAN=[];
function onLeave(f){CLEAN.push(f)}
function cleanup(){CLEAN.forEach(f=>{try{f()}catch(e){}});CLEAN=[]}
function runLoop(host,fn){
  let id,last=performance.now(),on=true;
  function f(t){if(!on)return;if(!host.isConnected){on=false;return}const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt,t);id=requestAnimationFrame(f)}
  id=requestAnimationFrame(f);const stop=()=>{on=false;cancelAnimationFrame(id)};onLeave(stop);return stop;
}
let _seed=7;function rnd(){_seed=(_seed*16807)%2147483647;return(_seed-1)/2147483646}
function seeded(s){let a=s;return()=>{a=(a*16807)%2147483647;return(a-1)/2147483646}}

  let s=`<svg viewBox="${o.labels?'-70 0 540 440':'0 0 400 440'}" role="img" aria-label="Diagram of the human respiratory system" xmlns="http://www.w3.org/2000/svg">`;

  s+=g('pharynx',`<rect x="190" y="88" width="20" height="34" rx="9" fill="#ef8c8c" stroke="#bb5f5f" stroke-width="1.5"/>`);
  s+=g('larynx',`<rect x="189" y="122" width="22" height="24" rx="5" fill="#e6c47a" stroke="#b08c3c" stroke-width="1.5"/><path d="M194 134 H206" stroke="#b08c3c" stroke-width="2"/>`);
  let tr=`<rect x="191" y="146" width="18" height="94" fill="#b6cdee" stroke="#5d7fb5" stroke-width="1.5"/>`;for(let y=152;y<240;y+=9)tr+=`<path d="M191 ${y}H209" stroke="#5d7fb5" stroke-width="1.6"/>`;
  s+=g('trachea',tr);
  s+=g('lungs',`<path d="${LUNG}" fill="#f2a0a6" stroke="#c46a74" stroke-width="2"/>`+mir(`<path d="${LUNG}" fill="#f2a0a6" stroke="#c46a74" stroke-width="2"/>`));
  s+=g('bronchi',`<path d="M200 238 Q180 252 158 274" fill="none" stroke="#7ea6dd" stroke-width="11" stroke-linecap="round"/>`+mir(`<path d="M200 238 Q180 252 158 274" fill="none" stroke="#7ea6dd" stroke-width="11" stroke-linecap="round"/>`));

  s+=g('alveoli',ALVL.map(a=>cluster(a[0],a[1])).join('')+mir(ALVL.map(a=>cluster(a[0],a[1])).join('')));
