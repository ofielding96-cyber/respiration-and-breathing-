/* ===== Module 1: clickable respiratory system ===== */
function mountResp(host,m,done){
  const seen=new Set();
  host.innerHTML=`<div class="sim"><div class="diagram" id="rd">${respSVG({interactive:true})}</div><div><div class="card alt" id="rinfo" aria-live="polite"><h3>Click or tap a structure</h3><p>Choose any part of the diagram to learn what it is, what it does and how it is adapted.</p><p class="small muted">Keyboard: Tab to a structure, then press Enter.</p></div><div class="row" style="margin-top:10px"><span class="badge-chip" id="rcount">0 of 10 explored</span></div><div class="pillrow" id="rlist" style="margin-top:10px">${Object.keys(NAMES).map(k=>`<button class="btn sm" data-s="${k}">${NAMES[k]}</button>`).join('')}</div></div></div>`;
  function show(id){
    if(!STRUCT[id])return;const S_=STRUCT[id];seen.add(id);
    $$('.st',host).forEach(e=>e.classList.toggle('on',e.dataset.s===id));
    $('#rinfo',host).innerHTML=`<h3>${S_.n}</h3><p><b>What is it?</b> ${rt(S_.what)}</p><p><b>Job:</b> ${rt(S_.fn)}</p><p><b>Adapted for its job:</b> ${rt(S_.ad)}</p>`;
    $('#rcount',host).textContent=`${seen.size} of 10 explored`;
    $$('#rlist button',host).forEach(b=>{if(seen.has(b.dataset.s))b.classList.add('on')});
    if(seen.size>=8)done&&done();
  }
  host.addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(t&&host.contains(t))show(t.dataset.s)});
  host.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const t=e.target.closest('.st');if(t){e.preventDefault();show(t.dataset.s)}}});
  const st=document.createElement('style');st.textContent='.st.on *{filter:drop-shadow(0 0 5px #f6c343);stroke:#e8832a!important}.st:hover *{filter:brightness(1.08)}.st:focus{outline:none}.st:focus-visible *{stroke:#1f5fc4!important;stroke-width:3}';host.appendChild(st);
}

  const explain={down:'<b>Correct!</b> The balloons <b>inflate</b>. Pulling the sheet down <b>increases the volume</b> in the jar, so the <b>pressure decreases</b>. Air is pushed from the higher pressure outside, through the tube, into the balloons. This is like <b>inhalation</b>.',
                 up:'<b>Correct!</b> The balloons <b>deflate</b>. Pushing the sheet up <b>decreases the volume</b> in the jar, so the <b>pressure increases</b>. Air is pushed out of the balloons through the tube. This is like <b>exhalation</b>.'};
  const wrong={down:'<b>Not quite.</b> Watch the balloons: they <b>inflate</b>. Volume in the jar increases → pressure decreases → air is pushed in from outside. Like inhalation.',up:'<b>Not quite.</b> Watch the balloons: they <b>deflate</b>. Volume in the jar decreases → pressure increases → air is pushed out. Like exhalation.'};
  ['1','2'].forEach(n=>{
    const rs=$$(`input[name=p${n}]`,host),b=$('#go'+n,host);
    rs.forEach(r=>r.onchange=()=>{b.disabled=false;rs.forEach(x=>x.closest('.opt').classList.toggle('sel',x.checked))});
    b.onclick=()=>{
      const choice=+($(`input[name=p${n}]:checked`,host)||{}).value;const key=n==='1'?'down':'up';const right=key==='down'?0:1;
      if(key==='up'){s=0;ts=0}
      animateTo(key==='down'?1:-1,()=>{});
      const f=$('#f'+n,host);f.className='fb '+(choice===right?'ok':'bad');f.innerHTML=(choice===right?explain[key]:wrong[key]);
      revealed[key]=true;if(revealed.down&&revealed.up)done&&done();
    };
  });
  $('#jSl',host).oninput=e=>{ts=e.target.value/100;s=ts};
  $('#jReset',host).onclick=()=>{ts=0;if(reduced())s=0};
  // drag the knob
  const knob=$('#knob',svg);
  knob.addEventListener('pointerdown',e=>{
    knob.setPointerCapture(e.pointerId);
    const mv=ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());const y=clamp(p.y,292,392);ts=y>=332?(y-332)/54:(y-332)/40;ts=clamp(ts,-1,1);if(reduced())s=ts};
    const up=()=>{knob.removeEventListener('pointermove',mv);knob.removeEventListener('pointerup',up)};
    knob.addEventListener('pointermove',mv);knob.addEventListener('pointerup',up);
  });
  knob.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){ts=clamp(ts+.2,-1,1);e.preventDefault()}if(e.key==='ArrowUp'){ts=clamp(ts-.2,-1,1);e.preventDefault()}});
  runLoop(host,dt=>{const prev=s;if(!reduced()&&s!==ts)s+=clamp(ts-s,-dt*.8,dt*.8);vS=vS*.8+((s-prev)/Math.max(dt,1e-3))*.2;if(Math.abs(vS)<.02)vS=0;render()});
  render();
}

  s+=`<path d="M300 150 L346 175" stroke="#4b2575" fill="none" stroke-width="1.2"/>`;

/* ===== Module 3: alveolus & capillary animation ===== */
function mountAlveolus(host,done){
  let dmg=false,seenH=true,seenD=false,reducedMode=reduced();
  const P=[];const t0=performance.now();let hist=[];
  function mk(kind){return{kind,loc:'air',x:190,y:175,a:0,r:128,vx:0,vy:0}}
  function inAir(){const th=rnd()*6.28,rr=Math.sqrt(rnd())*92;return[190+rr*Math.cos(th),175+rr*Math.sin(th)]}
  function spawn(p){
    if(p.kind==='O'){p.loc='air';[p.x,p.y]=inAir()}else{p.loc='blood';p.a=-56+rnd()*10;p.r=118+rnd()*20}
  }
  for(let i=0;i<22;i++){const p=mk('O');spawn(p);P.push(p)}
  for(let i=0;i<14;i++){const p=mk('C');spawn(p);p.a=-56+rnd()*100;P.push(p)}
  host.innerHTML=`<div class="sim"><div class="diagram"><div id="asv"></div></div><div class="ctrls">
   <div class="tabs2" role="tablist"><button role="tab" aria-selected="true" id="tH">Healthy alveolus</button><button role="tab" aria-selected="false" id="tD">Damaged alveolus (smoker)</button></div>
   <div class="row"><span class="badge-chip" style="background:#dbe8fb;color:#0c2f66">● Oxygen</span><span class="badge-chip warn">● Carbon dioxide</span></div>
   <div class="readout"><div><b>Oxygen into blood (last 10 s)</b><span id="cO">0</span></div><div><b>CO₂ into alveolus (last 10 s)</b><span id="cC">0</span></div></div>
   <div class="callout teal" id="atxt" style="margin:0"><b class="t">Healthy alveolus</b>Oxygen is at a high concentration in the alveolus and a low concentration in the blood, so it <b>diffuses into the blood</b>. Carbon dioxide diffuses the other way. The blood keeps moving, so the concentration gradient stays steep.</div>
   ${reducedMode?'<button class="btn sm" id="astep" type="button">Step ▶ (move the particles)</button>':''}
   <p class="small muted">Particle counts are a simplified, illustrative model, not real measurements.</p>
  </div></div>`;
  const hostSvg=$('#asv',host);
  function drawBase(){hostSvg.innerHTML=alvSVG({damaged:dmg,id:'asvg'}).replace(/gas A → blood|gas B → alveolus/g,'').replace('<text x="236" y="222" font-size="14" font-weight="800" fill="#1f5fc4" font-family="system-ui,sans-serif"></text>','').replace('<text x="236" y="266" font-size="14" font-weight="800" fill="#a65a10" font-family="system-ui,sans-serif"></text>','');
    const svg=$('#asvg',host);svg.insertAdjacentHTML('beforeend','<g id="pts"></g>')}
  drawBase();
  function lim(){return dmg?26:52}
  function step(dt){
    const now=performance.now();
    P.forEach(p=>{
      if(p.loc==='air'){
        p.x+=(rnd()-.5)*140*dt;p.y+=(rnd()-.5)*140*dt;
        const dx=p.x-190,dy=p.y-175,d=Math.hypot(dx,dy);
        if(d>96){p.x=190+dx/d*96;p.y=175+dy/d*96}
        if(p.kind==='O'){
          const ang=Math.atan2(dy,dx)*180/Math.PI;
          if(d>78&&Math.abs(ang)<lim()&&rnd()<(dmg?.9:2.2)*dt*(d>88?1.6:1)){p.loc='blood';p.a=ang;p.r=120+rnd()*14;hist.push({k:'O',t:now})}
          // drift towards the wall (diffusion down the gradient)
          p.x+=(Math.cos(0)*18)*dt;
        }else{
          // CO2 leaves by the bronchiole
          if(Math.hypot(p.x-125,p.y-105)<22){hist.push({k:'E',t:now});spawn(p);}
          p.x-=12*dt;p.y-=8*dt;
        }
      }else{
        p.a+=(26+rnd()*8)*dt;p.r=clamp(p.r+(rnd()-.5)*30*dt,114,142);
        if(p.kind==='C'){
          const ang=p.a;if(Math.abs(ang)<lim()&&rnd()<(dmg?.8:2)*dt){p.loc='air';const rr=95;p.x=190+rr*Math.cos(ang*Math.PI/180);p.y=175+rr*Math.sin(ang*Math.PI/180);hist.push({k:'C',t:now});return}
        }
        if(p.a>58){const k=p.kind;p.a=-56;if(k==='O'){spawn(p)}else{p.r=118+rnd()*20}}
      }
    });
    hist=hist.filter(h=>now-h.t<10000);
  }
  function draw(){
    let s='';P.forEach(p=>{let x,y;if(p.loc==='air'){x=p.x;y=p.y}else{x=190+p.r*Math.cos(p.a*Math.PI/180);y=175+p.r*Math.sin(p.a*Math.PI/180)}
      s+=p.kind==='O'?`<circle cx="${x}" cy="${y}" r="6.5" fill="#2a7de1" stroke="#0c3f8c"/><text x="${x}" y="${y+3.3}" text-anchor="middle" font-size="7.5" font-weight="800" fill="#fff" font-family="system-ui">O₂</text>`:`<circle cx="${x}" cy="${y}" r="7" fill="#f0a24a" stroke="#a65a10"/><text x="${x}" y="${y+3.3}" text-anchor="middle" font-size="6.5" font-weight="800" fill="#3b1d00" font-family="system-ui">CO₂</text>`});
    const g=$('#pts',host);if(g)g.innerHTML=s;
    const now=performance.now();$('#cO',host).textContent=hist.filter(h=>h.k==='O'&&now-h.t<10000).length;$('#cC',host).textContent=hist.filter(h=>h.k==='C'&&now-h.t<10000).length;
  }
  function setMode(d){
    dmg=d;$('#tH',host).setAttribute('aria-selected',!d);$('#tD',host).setAttribute('aria-selected',d);hist=[];drawBase();
    $('#atxt',host).className='callout '+(d?'coral':'teal');
    $('#atxt',host).innerHTML=d?'<b class="t">Damaged alveolus</b>The walls have broken down, leaving a <b>larger air space</b> with <b>less surface area</b> touching the blood. Fewer oxygen particles can diffuse into the blood each second, so the person feels breathless and tired.':'<b class="t">Healthy alveolus</b>Oxygen is at a high concentration in the alveolus and a low concentration in the blood, so it <b>diffuses into the blood</b>. Carbon dioxide diffuses the other way. The blood keeps moving, so the concentration gradient stays steep.';
    if(d)seenD=true;if(seenD&&seenH)done&&done();
  }
  $('#tH',host).onclick=()=>setMode(false);$('#tD',host).onclick=()=>setMode(true);
  if(reducedMode){$('#astep',host).onclick=()=>{for(let i=0;i<10;i++)step(.1);draw()}}
  runLoop(host,dt=>{if(!reduced())step(dt);draw()});
  draw();
}

/* ===== Module 3: diffusion sandbox ===== */
function mountDiffusion(host,done){
  const W=560,H=260,N=48;let open=false,temp=1.5,elapsed=0,P=[],ok=false;
  function reset(){P=[];const R=seeded(Math.floor(Math.random()*9000)+3);for(let i=0;i<N;i++){const a=R()*6.28;P.push({x:14+R()*(W/2-30),y:14+R()*(H-28),vx:Math.cos(a),vy:Math.sin(a)})}elapsed=0}
  reset();
  host.innerHTML=`<div class="stack"><div class="diagram"><canvas id="dc" width="${W}" height="${H}" style="width:100%;height:auto;display:block;border-radius:10px" role="img" aria-label="Particles moving randomly in two chambers separated by a barrier"></canvas></div>
  <div class="row"><button class="btn primary" id="dBar" type="button">Remove the barrier</button><button class="btn" id="dReset" type="button">Reset</button><label class="row" style="flex:1;min-width:200px;gap:8px;font-weight:700;font-size:.9rem">Temperature<input type="range" id="dT" min="0.5" max="3" step="0.1" value="1.5" aria-label="Temperature, which sets particle speed"></label></div>
  <div class="grid g2"><div class="card alt"><b class="small">Left side</b><div class="bar" style="margin:6px 0"><i id="dL" style="width:100%"></i></div><span id="dLn" class="small"></span></div><div class="card alt"><b class="small">Right side</b><div class="bar" style="margin:6px 0"><i id="dR" style="width:0%;background:var(--blue)"></i></div><span id="dRn" class="small"></span></div></div>
  <div class="callout teal" id="dMsg" style="margin:0"><b class="t">Try this</b>All the particles start on the left (high concentration on the left, low on the right). Remove the barrier and watch what happens. Then try changing the temperature.</div>
  ${reduced()?'<button class="btn sm" id="dStep" type="button">Step ▶ (move the particles)</button>':''}</div>`;
  const cv=$('#dc',host),ctx=cv.getContext('2d');
  function step(dt){
    elapsed+=dt;
    P.forEach(p=>{
      if(Math.random()<dt*3){const a=Math.atan2(p.vy,p.vx)+(Math.random()-.5)*2.4;p.vx=Math.cos(a);p.vy=Math.sin(a)}
      const sp=62*temp;let nx=p.x+p.vx*sp*dt,ny=p.y+p.vy*sp*dt;
      if(nx<7){nx=7;p.vx=Math.abs(p.vx)}if(nx>W-7){nx=W-7;p.vx=-Math.abs(p.vx)}
      if(ny<7){ny=7;p.vy=Math.abs(p.vy)}if(ny>H-7){ny=H-7;p.vy=-Math.abs(p.vy)}
      const bx=W/2;const crossing=(p.x<bx&&nx>=bx-3)||(p.x>bx&&nx<=bx+3);
      if(crossing){const inGap=ny>H/2-34&&ny<H/2+34;if(!open||!inGap){nx=p.x;p.vx=-p.vx}}
      p.x=nx;p.y=ny;
    });
  }
  function draw(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#fbf9ff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(31,95,196,.06)';ctx.fillRect(0,0,W/2,H);
    ctx.fillStyle='#4b2575';
    ctx.fillRect(W/2-3,0,6,open?H/2-34:H);if(open)ctx.fillRect(W/2-3,H/2+34,6,H/2-34);
    P.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,5.5,0,6.283);ctx.fillStyle='#2a7de1';ctx.fill();ctx.strokeStyle='#0c3f8c';ctx.lineWidth=1.2;ctx.stroke()});
    const L=P.filter(p=>p.x<W/2).length,Rn=N-L;
    $('#dL',host).style.width=100*L/N+'%';$('#dR',host).style.width=100*Rn/N+'%';$('#dLn',host).textContent=`${L} particles`;$('#dRn',host).textContent=`${Rn} particles`;
    const msg=$('#dMsg',host);
    if(open&&elapsed>3){
      if(Math.abs(L-Rn)<=Math.round(N*.25)){msg.className='callout blue';msg.innerHTML='<b class="t">Dynamic equilibrium</b>The particles are now spread out evenly. They are still moving randomly, but there is <b>no overall (net) movement</b> because the concentration is the same everywhere.';if(!ok){ok=true;done&&done()}}
      else{msg.className='callout teal';msg.innerHTML='<b class="t">Diffusion in action</b>More particles move from the left (<b>high concentration</b>) to the right (<b>low concentration</b>) than the other way. That is <b>net movement down the concentration gradient</b>.'}
    }
  }
  $('#dBar',host).onclick=e=>{open=!open;e.target.textContent=open?'Put the barrier back':'Remove the barrier';elapsed=0};
  $('#dReset',host).onclick=()=>{reset();open=false;ok=false;$('#dBar',host).textContent='Remove the barrier';$('#dMsg',host).className='callout teal';$('#dMsg',host).innerHTML='<b class="t">Try this</b>All the particles start on the left. Remove the barrier and watch what happens.'};
  $('#dT',host).oninput=e=>temp=+e.target.value;
  const st=$('#dStep',host);if(st)st.onclick=()=>{for(let i=0;i<30;i++)step(.05);draw()};
  runLoop(host,dt=>{if(!reduced())step(dt);draw()});
  draw();
}

/* ===== Module 3: adaptations explorer ===== */
function mountAdapt(host,done){
  const A=[
   {n:'Walls one cell thick',x:300,y:120,how:'The alveolus wall is only one cell thick, so the distance the gases have to diffuse is tiny.',lnk:'A shorter distance means faster diffusion.'},
   {n:'Capillary walls one cell thick',x:312,y:240,how:'The capillary wall is also only one cell thick, so oxygen only has to cross two very thin layers to reach the blood.',lnk:'The rate of diffusion increases because the diffusion distance is short.'},
   {n:'Rich blood supply',x:320,y:72,how:'A network of capillaries surrounds each alveolus. The moving blood carries oxygen away and brings more carbon dioxide, so the concentration gradient stays steep.',lnk:'A steep concentration gradient means faster diffusion.'},
   {n:'Millions of alveoli (large surface area)',x:150,y:175,how:'The lungs contain millions of alveoli, which gives a very large surface area for gases to diffuse across at the same time.',lnk:'More surface area means more gas can diffuse each second.'},
   {n:'Breathing brings fresh air',x:60,y:50,how:'Ventilation keeps bringing fresh air (with lots of oxygen) into the alveoli and removes air with lots of carbon dioxide.',lnk:'This keeps the concentration of oxygen high in the alveolus, so the concentration gradient stays steep.'}
  ];
  const seen=new Set();
  host.innerHTML=`<div class="sim"><div class="diagram"><div id="adv" style="position:relative"></div></div><div><div class="card alt" id="ainfo" aria-live="polite"><h3>Which adaptation?</h3><p>Click a numbered circle on the diagram to see how each part of an alveolus is adapted for gas exchange.</p></div><div class="pillrow" style="margin-top:10px">${A.map((a,i)=>`<button class="btn sm" data-i="${i}">${i+1}. ${a.n}</button>`).join('')}</div><p class="small muted" style="margin-top:8px" id="acnt">0 of 5 explored</p></div></div>`;

function mountGraphReader(host,spec,opts={}){

  const fx0=spec.fit?spec.fit.x[0]:x0,fx1=spec.fit?spec.fit.x[1]:x1;

/* ===== Module 7: correlation spotter ===== */
function mountCorr(host,done){
  const R=seeded(77),mkp=(f)=>Array.from({length:16},(_,i)=>{const x=1+i*0.8+R()*.4;return[x,f(x)]});
  const sets=[
   {k:'p',pts:mkp(x=>6+2.6*x+(R()-.5)*7),t:'Hours of training vs distance run (illustrative)',xl:'Hours of training',yl:'Distance (km)'},
   {k:'n',pts:mkp(x=>46-2.8*x+(R()-.5)*7),t:'Age vs resting breathing rate (illustrative)',xl:'Age (years)',yl:'Breaths per minute'},
   {k:'0',pts:mkp(()=>8+R()*30),t:'Height vs number of freckles (illustrative)',xl:'Height (cm)',yl:'Freckles'}
  ];
  const ord=shuffle([0,1,2]);let ans={};
  host.innerHTML=`<div class="grid g3">${ord.map((i,k)=>`<div class="card alt" data-i="${i}"><b class="small">Graph ${k+1}</b>${chart({type:'scatter',w:300,h:230,x:[0,14,2],y:[0,60,10],xl:sets[i].xl,yl:sets[i].yl,series:[{n:'',pts:sets[i].pts,line:false,c:'#1f5fc4',stroke:true,r:4}],title:sets[i].t,alt:sets[i].t})}<div class="row" role="group" aria-label="Choose the correlation">${[['p','Positive'],['n','Negative'],['0','None']].map(b=>`<button class="btn sm" data-k="${b[0]}">${b[1]}</button>`).join('')}</div><div class="fb hide small" role="status"></div></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn purple" id="cChk" type="button">Check my answers</button></div><div class="callout blue" style="margin-top:12px"><b class="t">Remember</b>Positive: as one variable goes up, the other goes up. Negative: as one goes up, the other goes down. No correlation: no clear pattern.</div>`;
  $$('.card[data-i]',host).forEach(c=>c.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;$$('[data-k]',c).forEach(x=>x.classList.remove('on'));b.classList.add('on');ans[c.dataset.i]=b.dataset.k}));
  $('#cChk',host).onclick=()=>{
    let ok=0;$$('.card[data-i]',host).forEach(c=>{const i=c.dataset.i,f=$('.fb',c),right=sets[i].k===ans[i];f.classList.remove('hide');f.className='fb small '+(right?'ok':'bad');f.innerHTML=right?'✔ Correct':'✘ Look again: this one is <b>'+({p:'positive',n:'negative','0':'no correlation'})[sets[i].k]+'</b>.';if(right)ok++});
    if(ok===3){toast('All three correct!');done&&done()}
  };
}

function recs(){
  const out=MODS.map(mod=>{
    const p=modProg(mod.n),a=modAcc(mod.n),best=bestCheck(mod.n);
    const acc=a.acc;let need=((acc===null?0.35:1-acc)*60)+(100-p.total)*0.4-mod.n*0.4;
    let step,why;
    if(!p.learn){step='learn';why=a.n?'Read the Learn page to build a solid base.':'You haven’t started this one yet. Begin with the Learn page.'}
    else if(p.explore<1){step='explore';why='Try the interactive activities – they make the ideas stick.'}
    else if(p.practise<1){step='practise';why='Practise the questions to test what you know.'}
    else if(best===null){step='check';why='Take the short topic check to see how secure you are.'}
    else if(best<80){step='learn';why=`Your best check score is ${best}%. Re-read Learn, then retake the check.`}
    else{step='check';why='Looking strong. Retake the check later to keep it fresh.'}
    if(acc!==null&&acc<.6&&p.learn){why=`Your accuracy here is ${Math.round(acc*100)}%. Revisit the Learn page and retry the questions you missed.`;step='practise'}
    return{m:mod.n,need,step,why,acc,total:p.total};
  });
  return out.sort((a,b)=>b.need-a.need);
}

/* ---- exam practice ---- */
function examPool(){return QS.filter(q=>!q.ex&&q.t!=='w')}
function pickQuick(){
  const pool=examPool(),sel=[];
  MODS.forEach(m=>{const c=pool.filter(q=>q.m===m.n&&!sel.includes(q));sel.push(shuffle(c)[0])});
  const rest=shuffle(pool.filter(q=>!sel.includes(q)));while(sel.length<10)sel.push(rest.pop());
  return shuffle(sel);
}
function pickFull(){
  const pool=examPool(),sel=[];
  MODS.forEach(m=>[1,2,3].forEach(ao=>{const c=shuffle(pool.filter(q=>q.m===m.n&&q.ao===ao&&!sel.includes(q)));if(c.length)sel.push(c[0])}));
  const rest=shuffle(pool.filter(q=>!sel.includes(q)&&q.ao>=2));while(sel.length<25&&rest.length)sel.push(rest.pop());
  return shuffle(sel);
}

function viewWritten(){
  const wm=S._wmod||0;let pool=QS.filter(q=>q.t==='w'&&(!wm||q.m===wm));
  const pickBy=(mk,n)=>shuffle(pool.filter(q=>q.marks===mk)).slice(0,n);
  let sel=[...pickBy(1,1),...pickBy(2,2),...pickBy(3,2),...pickBy(4,1)];
  if(sel.length<5){const rest=shuffle(pool.filter(q=>!sel.includes(q)));while(sel.length<6&&rest.length)sel.push(rest.pop())}
  sel=sel.sort((a,b)=>a.marks-b.marks);
  setView(`<div class="wrap"><div class="crumbs"><a href="#/">Home</a> › <a href="#/exam">Exam practice</a> › Written practice</div><h1 style="color:#fff">Written Exam Practice</h1><p style="color:var(--onbg)">Type your answer, then reveal the model answer and mark scheme. Tick the points you really made. Self-marking is part of learning: be honest!</p><div id="run"></div></div>`,'Written practice');
  const host=$('#run');let i=0,e=0,o=0;const results=[];
  function step(){
    if(i>=sel.length){
      S.exams.push({d:Date.now(),type:'written',s:e,t:o});save();checkBadges();
      host.innerHTML=examResultsHTML('Written practice complete',results,e,o,'written').replace('Review every question','Your questions and model answers');return}
    const q=sel[i];host.innerHTML=`<div class="card alt" style="margin-bottom:14px"><div class="row"><b>Question ${i+1} of ${sel.length}</b><span class="sp"></span><span class="badge-chip">${q.marks} mark${q.marks>1?'s':''}</span></div><div class="bar thin" style="margin-top:8px"><i style="width:${Math.round(100*i/sel.length)}%"></i></div></div>${qHTML(q,{showMod:true})}<div class="row hide" id="nx"><button class="btn primary" type="button">${i+1<sel.length?'Next question →':'See my results →'}</button></div>`;
    bindQ($('.q',host),q,{noRetry:true,cb:r=>{e+=r.earned;o+=r.of;results.push({q,r});$('#nx',host).classList.remove('hide')}});
  }
  host.addEventListener('click',ev=>{if(ev.target.closest('#nx button')){i++;step()}});
  if(!sel.length){host.innerHTML='<div class="card"><p>No written questions for this topic yet.</p></div>';return}
  step();
}

  setView(`<div class="wrap"><div class="crumbs"><a href="#/">Home</a> › Glossary</div><h1 style="color:#fff">Glossary and flashcards</h1>

  function glossary(){
    body.innerHTML=`<div class="card"><div class="row"><input class="search" id="gs" placeholder="Search key words…" aria-label="Search the glossary"><span class="badge-chip good">${known} of ${keys.length} marked as known</span></div><dl class="gl" id="gl" style="margin-top:14px"></dl></div>`;

    draw('');$('#gs').oninput=e=>draw(e.target.value.toLowerCase().trim());
  }
  function cards(){
    body.innerHTML=`<div class="card"><div class="row"><label class="small" for="fdeck"><b>Choose a deck</b></label><select class="gapsel" id="fdeck"><option value="all">All key words (${keys.length})</option><option value="learn">Words I’m still learning</option>${MODS.map(m=>`<option value="m${m.n}">Module ${m.n}: ${esc(m.short)}</option>`).join('')}</select></div><div id="fhost" style="margin-top:14px"></div></div>`;
    const load=()=>{const v=$('#fdeck').value;let ks=keys;if(v==='learn')ks=keys.filter(k=>S.vocab[k]!=='known');else if(v[0]==='m')ks=MODS[+v.slice(1)-1].kw.map(k=>ALIAS[k]||k).filter((k,i,a)=>a.indexOf(k)===i);
      const h=$('#fhost');const c=h.cloneNode(false);h.replaceWith(c);mountFlash(c,ks)};
    $('#fdeck').onchange=load;load();
  }
  $('#tg').onclick=()=>{$('#tg').setAttribute('aria-selected',true);$('#tc').setAttribute('aria-selected',false);glossary()};
  $('#tc').onclick=()=>{$('#tc').setAttribute('aria-selected',true);$('#tg').setAttribute('aria-selected',false);cards()};
  mode==='cards'?cards():glossary();
}

  <tr><td>Breathing after a race (oxygen debt)</td><td>Module 5</td></tr>
  <tr><td>Germinating seeds with hydrogencarbonate indicator</td><td>Module 6 (seeds investigation)</td></tr></tbody></table></div>
  <p class="small muted">All questions are original and none reproduce the test verbatim. Several practice questions use similar scientific contexts with different data, wording and framing.</p></section>
  <section class="card"><h2>Assessment objectives</h2><p>The question bank has ${QS.filter(q=>!q.ex).length} questions (plus ${QS.filter(q=>q.ex).length} activity questions): AO1 ${QS.filter(q=>!q.ex&&q.ao===1).length}, AO2 ${QS.filter(q=>!q.ex&&q.ao===2).length}, AO3 ${QS.filter(q=>!q.ex&&q.ao===3).length}. Written questions are self-marked by pupils against a point-by-point mark scheme, because free text cannot be marked reliably automatically.</p></section></div></div>`,'For teachers');
}

/* ---- router ---- */
function route(){
  closeModal();
  const h=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  try{
    if(!h.length)return viewHome();
    if(h[0]==='m'){const m=+h[1];if(m>=1&&m<=7)return viewModule(m,['learn','explore','practise','check'].includes(h[2])?h[2]:'learn')}
    if(h[0]==='exam'){if(h[1]==='quick'||h[1]==='full'||h[1]==='written')return viewExamRun(h[1]);return viewExam()}
    if(h[0]==='glossary')return viewGlossary(h[1]);
    if(h[0]==='progress')return viewProgress();
    if(h[0]==='teacher')return viewTeacher();
  }catch(err){console.error(err);setView(`<div class="wrap"><div class="card"><h1>Something went wrong</h1><p>Please go back to the <a href="#/">home page</a>.</p><pre class="small">${esc(String(err&&err.stack||err))}</pre></div></div>`);return}
  viewHome();
}
window.addEventListener('hashchange',route);
document.addEventListener('DOMContentLoaded',()=>{
  loadState();applySettings();route();checkBadges();
  $('#settingsBtn').onclick=openSettings;
});

</script>
</body>
</html>
